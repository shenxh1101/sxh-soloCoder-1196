<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔮 塔罗牌占卜</title>
<style>
:root {
  --bg: #1a0a2e;
  --bg-panel: #1f1140;
  --bg-card: #2a1555;
  --gold: #d4a843;
  --gold-light: #f0d68a;
  --text: #e8d5f5;
  --text-dim: #9988b8;
  --accent: #7b5ea7;
  --purple-glow: rgba(140, 100, 220, 0.4);
  --card-width: 140px;
  --card-height: 230px;
  --radius: 16px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  background-image:
    radial-gradient(ellipse at 20% 20%, rgba(100, 50, 180, 0.15) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 80%, rgba(40, 20, 100, 0.2) 0%, transparent 60%);
}

.stars {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
}
.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  animation: twinkle var(--dur) ease-in-out infinite;
  animation-delay: var(--delay);
  opacity: 0;
}
@keyframes twinkle {
  0%,100% { opacity: 0.2; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.5); }
}

.app-container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 20px; }

/* ===== HEADER ===== */
.header {
  text-align: center; padding: 30px 20px 20px;
  position: relative;
}
.header h1 {
  font-size: 2.4em;
  background: linear-gradient(135deg, var(--gold-light), var(--gold), #b8860b);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 700;
  letter-spacing: 2px;
  text-shadow: none;
}
.header .subtitle {
  color: var(--text-dim);
  font-size: 0.95em;
  margin-top: 4px;
  letter-spacing: 4px;
}

/* ===== NAV ===== */
.nav {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin: 10px 0 30px;
  flex-wrap: wrap;
  background: var(--bg-panel);
  border-radius: 40px;
  padding: 5px;
  border: 1px solid rgba(212, 168, 67, 0.2);
}
.nav-btn {
  padding: 10px 22px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  border-radius: 30px;
  cursor: pointer;
  font-size: 0.95em;
  transition: var(--transition);
  font-family: inherit;
  letter-spacing: 1px;
  white-space: nowrap;
}
.nav-btn:hover { color: var(--gold-light); }
.nav-btn.active {
  background: linear-gradient(135deg, var(--accent), #5a3d8a);
  color: #fff;
  box-shadow: 0 4px 15px var(--purple-glow);
}

/* ===== PANELS ===== */
.panel {
  display: none;
  animation: fadeSlideIn 0.4s ease;
}
.panel.active { display: block; }
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

.section-title {
  text-align: center;
  font-size: 1.4em;
  color: var(--gold-light);
  margin-bottom: 24px;
  letter-spacing: 2px;
}

/* ===== TOPIC INPUT ===== */
.topic-area {
  max-width: 500px;
  margin: 0 auto 24px;
  text-align: center;
}
.topic-input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.topic-input {
  flex: 1;
  padding: 10px 16px;
  border-radius: 25px;
  border: 1px solid rgba(212,168,67,0.3);
  background: var(--bg-panel);
  color: var(--text);
  font-family: inherit;
  font-size: 0.9em;
  outline: none;
  transition: var(--transition);
}
.topic-input:focus { border-color: var(--gold); }
.topic-input::placeholder { color: var(--text-dim); }
.topic-tags {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}
.topic-tag {
  padding: 6px 16px;
  border-radius: 20px;
  border: 1px solid rgba(212,168,67,0.25);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 0.82em;
  font-family: inherit;
  transition: var(--transition);
}
.topic-tag:hover { border-color: var(--gold); color: var(--gold-light); }
.topic-tag.selected {
  background: rgba(212,168,67,0.15);
  border-color: var(--gold);
  color: var(--gold-light);
}

/* ===== SPREAD SELECTOR (three-card) ===== */
.spread-selector {
  text-align: center;
  margin-bottom: 20px;
  display: none;
}
.spread-selector.visible { display: block; }
.spread-selector select {
  padding: 9px 16px;
  border-radius: 25px;
  border: 1px solid var(--accent);
  background: var(--bg-panel);
  color: var(--text);
  font-family: inherit;
  font-size: 0.9em;
  cursor: pointer;
  outline: none;
}

/* ===== DIVINATION PANEL ===== */
.mode-select {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.mode-card {
  background: var(--bg-panel);
  border: 2px solid rgba(212, 168, 67, 0.15);
  border-radius: var(--radius);
  padding: 24px 32px;
  cursor: pointer;
  transition: var(--transition);
  text-align: center;
  min-width: 160px;
}
.mode-card:hover {
  border-color: var(--gold);
  transform: translateY(-3px);
  box-shadow: 0 8px 30px var(--purple-glow);
}
.mode-card.selected {
  border-color: var(--gold);
  background: rgba(212, 168, 67, 0.1);
  box-shadow: 0 0 25px var(--purple-glow);
}
.mode-card .mode-icon { font-size: 2.5em; margin-bottom: 8px; }
.mode-card .mode-name { font-size: 1.1em; font-weight: 600; color: var(--gold-light); }
.mode-card .mode-desc { font-size: 0.8em; color: var(--text-dim); margin-top: 4px; }

.deck-area {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 0;
  perspective: 1000px;
  min-height: 280px;
}

.deck-stack {
  position: relative;
  width: var(--card-width);
  height: var(--card-height);
  cursor: pointer;
}

.stack-card {
  position: absolute;
  width: 100%; height: 100%;
  border-radius: 12px;
  transition: transform 0.5s ease, opacity 0.5s ease;
}

.stack-card:nth-child(1) { transform: translate(-6px, 4px); }
.stack-card:nth-child(2) { transform: translate(0px, 2px); }
.stack-card:nth-child(3) { transform: translate(6px, 0px); }

.deck-stack:hover .stack-card:nth-child(1) { transform: translate(-12px, 6px); }
.deck-stack:hover .stack-card:nth-child(2) { transform: translate(0px, 0px); }
.deck-stack:hover .stack-card:nth-child(3) { transform: translate(12px, -6px); }

/* Card design */
.tarot-card {
  width: var(--card-width);
  height: var(--card-height);
  border-radius: 12px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 25px rgba(0,0,0,0.5);
  transition: var(--transition);
  user-select: none;
}

.card-back {
  width: 100%; height: 100%;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Card back patterns */
.card-back.classic {
  background: linear-gradient(135deg, #1a0a3e, #2d1b69);
  border: 3px solid var(--gold);
}
.card-back.classic::after {
  content: '✦';
  font-size: 3em;
  color: var(--gold);
  text-shadow: 0 0 20px var(--gold);
  animation: rotateStar 8s linear infinite;
}
@keyframes rotateStar {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.card-back.mystic {
  background:
    repeating-conic-gradient(#1a0a3e 0% 5%, #2d1b69 5% 10%) 50% / 30px 30px;
  border: 3px solid #9b59b6;
}
.card-back.mystic::after {
  content: '🌙';
  font-size: 2.8em;
  filter: drop-shadow(0 0 12px #9b59b6);
}

.card-back.celestial {
  background: radial-gradient(circle at 30% 30%, #0d1b3e, #050d22);
  border: 3px solid #4fc3f7;
}
.card-back.celestial::after {
  content: '☀';
  font-size: 3em;
  color: #ffd54f;
  text-shadow: 0 0 25px #ffd54f;
}

.card-back.rose {
  background: linear-gradient(135deg, #3e1a3e, #2d0a2d);
  border: 3px solid #e91e63;
}
.card-back.rose::after {
  content: '🌹';
  font-size: 2.8em;
  filter: drop-shadow(0 0 12px #e91e63);
}

.card-back.royal {
  background: linear-gradient(135deg, #1a0a3e, #3e1a0a);
  border: 3px solid #ff6f00;
}
.card-back.royal::after {
  content: '👑';
  font-size: 2.8em;
  filter: drop-shadow(0 0 12px #ff6f00);
}

/* Card face */
.card-face {
  width: 100%; height: 100%;
  border-radius: 10px;
  background: linear-gradient(180deg, #faf3e0 0%, #e8d5b7 60%, #d4c4a0 100%);
  color: #2a1555;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px 8px;
  text-align: center;
  border: 3px solid var(--gold);
  font-weight: 700;
  position: relative;
}

.card-face.reversed {
  transform: rotate(180deg);
}

.card-face .card-num {
  font-size: 0.7em;
  color: #6a4a8a;
  letter-spacing: 1px;
}

.card-face .card-emoji {
  font-size: 2.5em;
  margin: 6px 0;
}

.card-face .card-name {
  font-size: 0.9em;
  line-height: 1.3;
  color: #3e1a6e;
}

.card-face .card-suit {
  font-size: 1.4em;
}

.minor-wands { border-color: #e65100; }
.minor-cups { border-color: #1565c0; }
.minor-swords { border-color: #ffd600; }
.minor-pentacles { border-color: #2e7d32; }
.major-arcana { border-color: var(--gold); }

.suit-icon {
  font-size: 1.6em;
  margin-bottom: 2px;
}

/* Shuffle animation */
.shuffling .deck-stack {
  animation: deckShake 0.6s ease-in-out;
}
@keyframes deckShake {
  0%,100% { transform: translateX(0); }
  10% { transform: translateX(-15px) rotate(-3deg); }
  30% { transform: translateX(15px) rotate(3deg); }
  50% { transform: translateX(-10px) rotate(-2deg); }
  70% { transform: translateX(10px) rotate(1deg); }
  90% { transform: translateX(-4px) rotate(-0.5deg); }
}

.cut-animation .stack-card {
  animation: cardCut 0.8s ease forwards;
}
.cut-animation .stack-card:nth-child(1) {
  animation-name: cutLeft;
}
.cut-animation .stack-card:nth-child(2) {
  animation-name: cutCenter;
}
.cut-animation .stack-card:nth-child(3) {
  animation-name: cutRight;
}
@keyframes cutLeft {
  0% { transform: translate(-6px, 4px); }
  40% { transform: translate(-60px, -20px) rotate(-15deg); }
  100% { transform: translate(-6px, 4px); }
}
@keyframes cutCenter {
  0% { transform: translate(0px, 2px); }
  40% { transform: translate(0px, -30px); }
  100% { transform: translate(0px, 2px); }
}
@keyframes cutRight {
  0% { transform: translate(6px, 0px); }
  40% { transform: translate(60px, -20px) rotate(15deg); }
  100% { transform: translate(6px, 0px); }
}

/* Draw button */
.draw-btn {
  display: block;
  margin: 0 auto 20px;
  padding: 14px 50px;
  font-size: 1.15em;
  font-weight: 700;
  letter-spacing: 3px;
  border: none;
  border-radius: 40px;
  cursor: pointer;
  background: linear-gradient(135deg, var(--gold), #b8860b);
  color: #1a0a2e;
  transition: var(--transition);
  box-shadow: 0 6px 25px rgba(212,168,67,0.3);
  font-family: inherit;
}
.draw-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 35px rgba(212,168,67,0.5);
}
.draw-btn:active {
  transform: translateY(1px);
}
.draw-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

/* Result area */
.result-area {
  margin-top: 10px;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.5s ease;
}
.result-area.show {
  opacity: 1;
  transform: translateY(0);
}

.result-cards {
  display: flex;
  justify-content: center;
  gap: 24px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}

.result-card-wrapper {
  text-align: center;
  animation: cardReveal 0.8s ease forwards;
  animation-delay: var(--reveal-delay);
  opacity: 0;
}
@keyframes cardReveal {
  0% { opacity: 0; transform: translateY(40px) rotateY(90deg); }
  100% { opacity: 1; transform: translateY(0) rotateY(0deg); }
}

.result-card-wrapper .tarot-card {
  cursor: default;
  margin: 0 auto;
}

.position-label {
  color: var(--gold-light);
  font-size: 0.85em;
  margin-bottom: 8px;
  letter-spacing: 1px;
}

.card-interpretation {
  background: var(--bg-panel);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-top: 12px;
  border: 1px solid rgba(212,168,67,0.15);
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
}

.card-interpretation .card-title {
  font-size: 1.1em;
  color: var(--gold-light);
  font-weight: 700;
  margin-bottom: 4px;
}

.card-interpretation .orientation-badge {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 20px;
  font-size: 0.8em;
  font-weight: 600;
  margin-bottom: 10px;
}
.orientation-badge.upright {
  background: rgba(46,204,113,0.2);
  color: #2ecc71;
}
.orientation-badge.reversed-badge {
  background: rgba(231,76,60,0.2);
  color: #e74c3c;
}

.card-interpretation .meaning-text {
  color: var(--text);
  font-size: 0.95em;
  line-height: 1.7;
  margin-top: 8px;
}

/* ===== HISTORY FILTER ===== */
.history-filter {
  max-width: 600px;
  margin: 0 auto 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  justify-content: center;
}
.history-filter .filter-btn {
  padding: 6px 16px;
  border-radius: 20px;
  border: 1px solid rgba(212,168,67,0.25);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 0.82em;
  font-family: inherit;
  transition: var(--transition);
}
.history-filter .filter-btn:hover { border-color: var(--gold); color: var(--gold-light); }
.history-filter .filter-btn.active {
  background: rgba(212,168,67,0.15);
  border-color: var(--gold);
  color: var(--gold-light);
}
.history-filter .filter-search {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid rgba(212,168,67,0.25);
  background: var(--bg-panel);
  color: var(--text);
  font-family: inherit;
  font-size: 0.82em;
  outline: none;
  width: 160px;
}
.history-filter .filter-search:focus { border-color: var(--gold); }
.history-filter .filter-search::placeholder { color: var(--text-dim); }
.history-filter .filter-count {
  color: var(--text-dim);
  font-size: 0.78em;
}

/* ===== SUMMARY BOX ===== */
.summary-box {
  background: linear-gradient(135deg, rgba(212,168,67,0.08), rgba(140,100,220,0.08));
  border: 1px solid var(--gold);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin: 20px auto;
  max-width: 600px;
  position: relative;
}
.summary-box::before {
  content: '📖 整体解读';
  position: absolute;
  top: -12px;
  left: 24px;
  background: var(--bg-panel);
  padding: 2px 14px;
  color: var(--gold-light);
  font-size: 0.85em;
  font-weight: 700;
  border-radius: 12px;
  letter-spacing: 1px;
}
.summary-box .summary-text {
  color: var(--text);
  font-size: 0.95em;
  line-height: 1.9;
  margin-top: 4px;
}

/* ===== POSITION DESC IN INTERPRETATION ===== */
.position-desc {
  font-size: 0.82em;
  color: var(--text-dim);
  font-style: italic;
  margin-bottom: 4px;
  padding: 4px 10px;
  background: rgba(212,168,67,0.06);
  border-radius: 8px;
  border-left: 2px solid var(--gold);
}

/* ===== CELL DESCRIPTION INPUT ===== */
.grid-cell .cell-desc-input {
  width: 90%;
  padding: 3px 6px;
  border: 1px solid rgba(140,100,220,0.3);
  border-radius: 6px;
  background: rgba(0,0,0,0.25);
  color: var(--text-dim);
  text-align: center;
  font-size: 0.68em;
  font-family: inherit;
  resize: none;
  margin-top: 2px;
  height: 28px;
}
.grid-cell .cell-desc-input::placeholder {
  color: rgba(153,136,184,0.5);
}
.grid-cell .cell-desc-input:focus {
  border-color: var(--accent);
  outline: none;
}

/* ===== HISTORY PANEL ===== */
.history-list {
  max-width: 600px;
  margin: 0 auto;
}

.history-item {
  background: var(--bg-panel);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 12px;
  border: 1px solid rgba(212,168,67,0.1);
  cursor: pointer;
  transition: var(--transition);
}
.history-item:hover {
  border-color: var(--gold);
  transform: translateX(4px);
}
.history-item .history-time {
  font-size: 0.8em;
  color: var(--text-dim);
}
.history-item .history-type {
  color: var(--gold-light);
  font-weight: 600;
  margin: 4px 0;
}
.history-item .history-topic {
  font-size: 0.82em;
  color: var(--text-dim);
  margin-bottom: 4px;
}
.history-item .history-topic span {
  color: var(--gold-light);
}
.history-item .history-cards {
  font-size: 0.9em;
  color: var(--text);
}

.history-empty {
  text-align: center;
  color: var(--text-dim);
  padding: 40px;
}

.clear-btn {
  display: block;
  margin: 20px auto;
  padding: 8px 24px;
  background: transparent;
  border: 1px solid rgba(231,76,60,0.5);
  border-radius: 20px;
  color: #e74c3c;
  cursor: pointer;
  font-size: 0.85em;
  transition: var(--transition);
  font-family: inherit;
}
.clear-btn:hover {
  background: rgba(231,76,60,0.1);
}

/* ===== SPREAD PANEL ===== */
.spread-mode-tabs {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
}
.spread-mode-tab {
  padding: 10px 28px;
  border-radius: 25px;
  border: 1px solid rgba(212,168,67,0.2);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  font-family: inherit;
  font-size: 0.9em;
  transition: var(--transition);
}
.spread-mode-tab:hover {
  border-color: var(--gold);
  color: var(--gold-light);
}
.spread-mode-tab.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.spread-controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.spread-controls button, .spread-controls select {
  padding: 10px 20px;
  border-radius: 25px;
  border: 1px solid var(--accent);
  background: var(--bg-panel);
  color: var(--text);
  cursor: pointer;
  font-family: inherit;
  font-size: 0.9em;
  transition: var(--transition);
}
.spread-controls button:hover {
  background: var(--accent);
  color: #fff;
}

.spread-grid-size {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-dim);
  font-size: 0.85em;
}
.spread-grid-size input {
  width: 50px;
  padding: 6px;
  border-radius: 8px;
  border: 1px solid var(--accent);
  background: var(--bg-panel);
  color: var(--text);
  text-align: center;
  font-family: inherit;
  font-size: 0.9em;
}

.spread-grid {
  display: grid;
  gap: 10px;
  justify-content: center;
  padding: 20px;
  min-height: 200px;
}

.grid-cell {
  width: 120px;
  height: 180px;
  border: 2px dashed rgba(212,168,67,0.3);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
  position: relative;
  background: rgba(42,21,85,0.4);
  cursor: pointer;
}

.grid-cell:hover {
  border-color: var(--gold);
  background: rgba(212,168,67,0.08);
}

.grid-cell.filled {
  border-style: solid;
  border-color: var(--gold);
  background: rgba(212,168,67,0.1);
}

.grid-cell .cell-name-input {
  width: 90%;
  padding: 4px 8px;
  border: 1px solid var(--accent);
  border-radius: 8px;
  background: rgba(0,0,0,0.3);
  color: var(--text);
  text-align: center;
  font-size: 0.8em;
  font-family: inherit;
  margin-top: 4px;
}

.grid-cell .cell-name-input::placeholder {
  color: var(--text-dim);
}

.grid-cell .cell-empty-text {
  color: var(--text-dim);
  font-size: 0.8em;
}

.grid-cell .cell-card-mini {
  width: 60px;
  height: 98px;
  border-radius: 8px;
  background: linear-gradient(180deg, #faf3e0, #e8d5b7);
  color: #2a1555;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4em;
  border: 2px solid var(--gold);
}

.grid-cell .cell-remove {
  position: absolute;
  top: 4px;
  right: 6px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: rgba(231,76,60,0.8);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 0.7em;
  display: none;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.grid-cell.filled .cell-remove {
  display: flex;
}

.spread-actions {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.spread-actions button {
  padding: 10px 24px;
  border-radius: 25px;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.9em;
  transition: var(--transition);
  letter-spacing: 1px;
}
.spread-actions .btn-save {
  background: var(--gold);
  color: #1a0a2e;
  font-weight: 700;
}
.spread-actions .btn-save:hover {
  background: var(--gold-light);
}
.spread-actions .btn-load {
  background: var(--accent);
  color: #fff;
}
.spread-actions .btn-load:hover {
  background: #8b6ab0;
}
.spread-actions .btn-delete {
  background: transparent;
  border: 1px solid #e74c3c;
  color: #e74c3c;
}
.spread-actions .btn-draw {
  background: linear-gradient(135deg, var(--gold), #b8860b);
  color: #1a0a2e;
  font-weight: 700;
  font-size: 1em;
  padding: 12px 32px;
}
.spread-actions .btn-draw:hover {
  background: var(--gold-light);
}

.saved-spreads-list {
  max-width: 400px;
  margin: 16px auto;
}
.saved-spreads-list h4 {
  color: var(--gold-light);
  margin-bottom: 8px;
  font-size: 0.9em;
}
.saved-spreads-list .saved-spread-item {
  background: var(--bg-panel);
  border-radius: 10px;
  padding: 10px 16px;
  margin-bottom: 6px;
  cursor: pointer;
  border: 1px solid rgba(212,168,67,0.1);
  transition: var(--transition);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.saved-spreads-list .saved-spread-item:hover {
  border-color: var(--gold);
}

/* ===== SPREAD READING TOPIC ===== */
.spread-topic-area {
  max-width: 400px;
  margin: 0 auto 16px;
  display: flex;
  gap: 8px;
}
.spread-topic-area .topic-input {
  margin-bottom: 0;
}

/* ===== SETTINGS PANEL ===== */
.settings-group {
  background: var(--bg-panel);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 16px;
  border: 1px solid rgba(212,168,67,0.1);
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
}
.settings-group h3 {
  color: var(--gold-light);
  margin-bottom: 14px;
  font-size: 1em;
}

.card-back-options {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: center;
}
.card-back-option {
  cursor: pointer;
  text-align: center;
  transition: var(--transition);
  padding: 6px;
  border-radius: 12px;
  border: 2px solid transparent;
}
.card-back-option:hover {
  border-color: var(--gold);
}
.card-back-option.selected {
  border-color: var(--gold);
  background: rgba(212,168,67,0.1);
}
.card-back-option .preview-card {
  width: 70px;
  height: 115px;
  border-radius: 8px;
  overflow: hidden;
}
.card-back-option .preview-name {
  font-size: 0.75em;
  color: var(--text-dim);
  margin-top: 4px;
}

/* ===== DAILY DRAW MODAL ===== */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.8);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  animation: fadeIn 0.3s ease;
  backdrop-filter: blur(4px);
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal {
  background: var(--bg-panel);
  border-radius: var(--radius);
  padding: 30px;
  max-width: 420px;
  width: 90%;
  text-align: center;
  border: 1px solid var(--gold);
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  animation: modalPopIn 0.4s ease;
}
@keyframes modalPopIn {
  0% { transform: scale(0.8); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.modal h2 {
  color: var(--gold-light);
  margin-bottom: 16px;
  font-size: 1.4em;
}

.modal .daily-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin: 16px 0;
}

.modal .daily-card .tarot-card {
  animation: cardReveal 0.8s ease;
}

.modal .close-btn {
  margin-top: 16px;
  padding: 10px 30px;
  border-radius: 25px;
  border: none;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.95em;
  transition: var(--transition);
}
.modal .close-btn:hover {
  background: #8b6ab0;
}

/* ===== FOOTER ===== */
.footer {
  text-align: center;
  padding: 30px;
  color: var(--text-dim);
  font-size: 0.8em;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 640px) {
  .header h1 { font-size: 1.8em; }
  .mode-card { padding: 16px 20px; min-width: 130px; }
  .mode-card .mode-icon { font-size: 2em; }
  .result-cards { gap: 16px; }
  .tarot-card { --card-width: 120px; --card-height: 196px; }
  .nav-btn { padding: 8px 14px; font-size: 0.8em; }
  .grid-cell { width: 90px; height: 140px; }
}

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--bg-panel);
  color: var(--gold-light);
  padding: 12px 28px;
  border-radius: 30px;
  font-size: 0.9em;
  border: 1px solid var(--gold);
  z-index: 2000;
  opacity: 0;
  transition: all 0.3s ease;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ===== EXPORT BUTTON ===== */
.export-btn {
  display: inline-block;
  padding: 8px 18px;
  border-radius: 20px;
  border: 1px solid var(--gold);
  background: transparent;
  color: var(--gold-light);
  cursor: pointer;
  font-size: 0.82em;
  font-family: inherit;
  transition: var(--transition);
  margin-top: 12px;
}
.export-btn:hover {
  background: rgba(212,168,67,0.15);
}

/* ===== FAVORITE ===== */
.fav-star {
  cursor: pointer;
  font-size: 1.2em;
  transition: var(--transition);
  color: var(--text-dim);
  background: none;
  border: none;
  padding: 0 4px;
  line-height: 1;
  vertical-align: middle;
}
.fav-star.active { color: var(--gold); }
.fav-star:hover { transform: scale(1.2); }

/* ===== NOTE AREA ===== */
.note-area {
  margin-top: 14px;
}
.note-area textarea {
  width: 100%;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid rgba(212,168,67,0.2);
  background: rgba(0,0,0,0.25);
  color: var(--text);
  font-family: inherit;
  font-size: 0.85em;
  resize: vertical;
  min-height: 60px;
  outline: none;
  transition: var(--transition);
}
.note-area textarea:focus { border-color: var(--gold); }
.note-area textarea::placeholder { color: var(--text-dim); }

/* ===== SHARE MODAL ===== */
.share-card-content {
  background: linear-gradient(180deg, #faf3e0, #f0e6c8);
  color: #3e1a6e;
  border-radius: 14px;
  padding: 24px 20px;
  font-size: 0.85em;
  line-height: 1.7;
  max-height: 50vh;
  overflow-y: auto;
  text-align: left;
  border: 2px solid var(--gold);
  margin: 16px 0;
}
.share-card-content .share-header {
  text-align: center;
  font-size: 1.1em;
  font-weight: 700;
  color: #2a1555;
  margin-bottom: 12px;
  letter-spacing: 1px;
}
.share-card-content .share-topic {
  text-align: center;
  color: #6a4a8a;
  margin-bottom: 14px;
  font-size: 0.95em;
}
.share-card-content .share-cards {
  margin-bottom: 10px;
}
.share-card-content .share-card-item {
  padding: 8px 0;
  border-bottom: 1px dashed rgba(106,74,138,0.2);
}
.share-card-content .share-card-item:last-child { border-bottom: none; }
.share-card-content .share-footer {
  text-align: center;
  color: #9988b8;
  font-size: 0.75em;
  margin-top: 12px;
  padding-top: 8px;
  border-top: 1px solid rgba(106,74,138,0.2);
}
.share-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}
.share-actions button {
  padding: 8px 20px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.85em;
  transition: var(--transition);
}
.share-actions .btn-copy {
  background: var(--gold);
  color: #1a0a2e;
  font-weight: 600;
}
.share-actions .btn-copy:hover { background: var(--gold-light); }

/* ===== REVIEW MODE ===== */
.review-toggle {
  text-align: center;
  margin: 12px 0;
}
.review-toggle button {
  padding: 6px 18px;
  border-radius: 18px;
  border: 1px solid var(--accent);
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  font-family: inherit;
  font-size: 0.82em;
  transition: var(--transition);
}
.review-toggle button:hover { background: rgba(123,94,167,0.15); }
.review-toggle button.active { background: var(--accent); color: #fff; }

.review-timeline {
  max-width: 600px;
  margin: 20px auto;
  padding-left: 20px;
  border-left: 2px solid rgba(212,168,67,0.3);
}
.review-timeline-item {
  position: relative;
  padding: 12px 16px;
  margin-bottom: 14px;
  background: var(--bg-panel);
  border-radius: 10px;
  border: 1px solid rgba(212,168,67,0.1);
  cursor: pointer;
  transition: var(--transition);
}
.review-timeline-item:hover { border-color: var(--gold); }
.review-timeline-item::before {
  content: '';
  position: absolute;
  left: -26px;
  top: 16px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--gold);
  border: 2px solid var(--bg);
}
.review-timeline-item .tl-time {
  font-size: 0.78em;
  color: var(--text-dim);
}
.review-timeline-item .tl-cards {
  font-size: 0.88em;
  color: var(--text);
  margin-top: 4px;
}
.review-trend {
  max-width: 600px;
  margin: 16px auto;
  padding: 16px 20px;
  background: linear-gradient(135deg, rgba(212,168,67,0.06), rgba(140,100,220,0.06));
  border-radius: 12px;
  border: 1px solid rgba(212,168,67,0.2);
}
.review-trend h4 {
  color: var(--gold-light);
  font-size: 0.9em;
  margin-bottom: 8px;
}

/* ===== ADVANCED FILTER ===== */
.adv-filter-toggle {
  text-align: center;
  margin-bottom: 8px;
}
.adv-filter-toggle button {
  padding: 4px 14px;
  border-radius: 14px;
  border: 1px dashed rgba(212,168,67,0.3);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  font-family: inherit;
  font-size: 0.78em;
  transition: var(--transition);
}
.adv-filter-toggle button:hover { border-color: var(--gold); color: var(--gold-light); }
.adv-filter-toggle button.active { border-style: solid; border-color: var(--accent); color: var(--accent); }

.adv-filter-panel {
  max-width: 600px;
  margin: 0 auto 12px;
  padding: 12px 16px;
  background: rgba(31,17,64,0.6);
  border-radius: 12px;
  border: 1px solid rgba(212,168,67,0.15);
  display: none;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: center;
}
.adv-filter-panel.visible { display: flex; }
.adv-filter-panel label {
  color: var(--text-dim);
  font-size: 0.78em;
}
.adv-filter-panel input, .adv-filter-panel select {
  padding: 5px 10px;
  border-radius: 8px;
  border: 1px solid rgba(212,168,67,0.2);
  background: var(--bg-panel);
  color: var(--text);
  font-family: inherit;
  font-size: 0.8em;
  outline: none;
}
.adv-filter-panel input:focus, .adv-filter-panel select:focus { border-color: var(--gold); }
.adv-filter-panel .adv-reset {
  padding: 5px 12px;
  border-radius: 12px;
  border: 1px solid rgba(231,76,60,0.4);
  background: transparent;
  color: #e74c3c;
  cursor: pointer;
  font-size: 0.78em;
  font-family: inherit;
  transition: var(--transition);
}
.adv-filter-panel .adv-reset:hover { background: rgba(231,76,60,0.1); }

/* ===== PER-CARD NOTE ===== */
.card-note-input {
  width: 100%;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid rgba(140,100,220,0.2);
  background: rgba(0,0,0,0.2);
  color: var(--text-dim);
  font-family: inherit;
  font-size: 0.78em;
  resize: none;
  min-height: 32px;
  outline: none;
  transition: var(--transition);
  margin-top: 4px;
}
.card-note-input:focus { border-color: var(--accent); color: var(--text); }
.card-note-input::placeholder { color: rgba(153,136,184,0.5); }

/* ===== SHARE NOTE TOGGLE ===== */
.share-note-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 8px 0;
  color: var(--text-dim);
  font-size: 0.8em;
}
.share-note-toggle input[type="checkbox"] {
  accent-color: var(--gold);
}

/* ===== POINTS ===== */
.points {
  color: var(--text-dim);
  font-size: 0.75em;
  text-align: center;
  margin-top: 4px;
}
.particles {
  position: fixed;
  pointer-events: none;
  z-index: 999;
}
.particle {
  position: absolute;
  font-size: 1.5em;
  animation: particleFloat 1.5s ease-out forwards;
  pointer-events: none;
}
@keyframes particleFloat {
  0% { opacity: 1; transform: translate(0, 0) scale(1); }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="app-container">
  <header class="header">
    <h1>🔮 神秘塔罗</h1>
    <div class="subtitle">T A R O T</div>
  </header>

  <nav class="nav">
    <button class="nav-btn active" data-panel="divination">🎴 占卜</button>
    <button class="nav-btn" data-panel="history">📜 历史</button>
    <button class="nav-btn" data-panel="spread">✨ 牌阵</button>
    <button class="nav-btn" data-panel="settings">⚙️ 设置</button>
  </nav>

  <!-- ===== DIVINATION PANEL ===== -->
  <section class="panel active" id="panel-divination">
    <h2 class="section-title">选择占卜方式</h2>

    <div class="mode-select">
      <div class="mode-card selected" data-mode="single" onclick="selectMode('single')">
        <div class="mode-icon">🃏</div>
        <div class="mode-name">单张牌</div>
        <div class="mode-desc">快速解答一个问题</div>
      </div>
      <div class="mode-card" data-mode="three" onclick="selectMode('three')">
        <div class="mode-icon">🎴🎴🎴</div>
        <div class="mode-name">三张牌</div>
        <div class="mode-desc" id="threeCardDesc">过去·现在·未来</div>
      </div>
    </div>

    <div class="spread-selector" id="spreadSelector">
      <select id="threeCardSpreadType" onchange="onSpreadTypeChange()">
        <option value="past-present-future">过去 · 现在 · 未来</option>
        <option value="situation-obstacle-advice">情况 · 阻碍 · 建议</option>
        <option value="body-mind-spirit">身 · 心 · 灵</option>
      </select>
    </div>

    <div class="topic-area">
      <div class="topic-input-row">
        <input type="text" class="topic-input" id="topicInput" placeholder="写下你想问的问题（可选）" maxlength="60" />
      </div>
      <div class="topic-tags" id="topicTags">
        <button class="topic-tag" data-topic="爱情" onclick="selectTopic('爱情', this)">💕 爱情</button>
        <button class="topic-tag" data-topic="事业" onclick="selectTopic('事业', this)">💼 事业</button>
        <button class="topic-tag" data-topic="学业" onclick="selectTopic('学业', this)">📚 学业</button>
        <button class="topic-tag" data-topic="财运" onclick="selectTopic('财运', this)">💰 财运</button>
        <button class="topic-tag" data-topic="健康" onclick="selectTopic('健康', this)">🏥 健康</button>
        <button class="topic-tag" data-topic="综合" onclick="selectTopic('综合', this)">🌟 综合</button>
      </div>
    </div>

    <div class="deck-area" id="deckArea">
      <div class="deck-stack" id="deckStack" onclick="triggerDraw()" title="点击洗牌抽牌">
        <div class="stack-card"><div class="tarot-card"><div class="card-back classic" id="deckBack1"></div></div></div>
        <div class="stack-card"><div class="tarot-card"><div class="card-back classic" id="deckBack2"></div></div></div>
        <div class="stack-card"><div class="tarot-card"><div class="card-back classic" id="deckBack3"></div></div></div>
      </div>
    </div>

    <button class="draw-btn" id="drawBtn" onclick="triggerDraw()">🔮 开始占卜</button>

    <div class="result-area" id="resultArea"></div>
    <div class="card-interpretation" id="interpretation" style="display:none;"></div>
  </section>

  <!-- ===== HISTORY PANEL ===== -->
  <section class="panel" id="panel-history">
    <h2 class="section-title">📜 占卜历史</h2>
    <div class="history-filter" id="historyFilter">
      <button class="filter-btn active" data-filter="all" onclick="setHistoryFilter('all', this)">全部</button>
      <button class="filter-btn" data-filter="单张牌" onclick="setHistoryFilter('单张牌', this)">🃏 单张牌</button>
      <button class="filter-btn" data-filter="三张牌" onclick="setHistoryFilter('三张牌', this)">🎴 三张牌</button>
      <button class="filter-btn" data-filter="自定义牌阵" onclick="setHistoryFilter('自定义牌阵', this)">✨ 自定义</button>
      <button class="filter-btn" data-filter="favorites" onclick="setHistoryFilter('favorites', this)">⭐ 收藏</button>
      <input type="text" class="filter-search" id="historySearch" placeholder="🔍 搜索主题..." oninput="onHistorySearch()" />
      <span class="filter-count" id="historyCount"></span>
    </div>
    <div class="adv-filter-toggle">
      <button id="advFilterBtn" onclick="toggleAdvFilter()">🔧 高级筛选</button>
    </div>
    <div class="adv-filter-panel" id="advFilterPanel">
      <label>从</label><input type="date" id="advDateFrom" onchange="onAdvFilterChange()" />
      <label>到</label><input type="date" id="advDateTo" onchange="onAdvFilterChange()" />
      <label>含牌</label><input type="text" id="advCardName" placeholder="牌名关键词" oninput="onAdvFilterChange()" style="width:100px;" />
      <select id="advOrientation" onchange="onAdvFilterChange()">
        <option value="all">全部正逆位</option>
        <option value="all-upright">全部正位</option>
        <option value="all-reversed">全部逆位</option>
        <option value="mixed">有正有逆</option>
      </select>
      <button class="adv-reset" onclick="resetAdvFilter()">清除高级筛选</button>
    </div>
    <div class="history-list" id="historyList"></div>
    <button class="clear-btn" onclick="clearHistory()">🗑️ 清除所有记录</button>
  </section>

  <!-- ===== SPREAD PANEL ===== -->
  <section class="panel" id="panel-spread">
    <h2 class="section-title">✨ 自定义牌阵</h2>

    <div class="spread-mode-tabs">
      <button class="spread-mode-tab active" data-spread-mode="design" onclick="switchSpreadMode('design')">🎨 设计牌阵</button>
      <button class="spread-mode-tab" data-spread-mode="reading" onclick="switchSpreadMode('reading')">🔮 使用牌阵占卜</button>
    </div>

    <div id="spreadDesignMode">
      <div class="spread-controls">
        <div class="spread-grid-size">
          行 <input type="number" id="gridRows" value="2" min="1" max="5" onchange="buildSpreadGrid()">
          列 <input type="number" id="gridCols" value="3" min="1" max="6" onchange="buildSpreadGrid()">
        </div>
        <button onclick="buildSpreadGrid()">🔄 重建网格</button>
      </div>
      <div class="spread-grid" id="spreadGrid"></div>
      <div class="spread-actions">

function getAllCards() {
  const cards = [];
  TAROT_DB.majorArcana.forEach(c => cards.push({ ...c, type: 'major' }));
  for (const [suit, suitCards] of Object.entries(TAROT_DB.minorArcana)) {
    suitCards.forEach(c => cards.push({ ...c, type: 'minor', suit }));
  }
  return cards;
}

}

function restoreHistoryFilter() {
  const state = loadHistoryState();
  if (state.filter) {

    document.querySelectorAll('#historyFilter .filter-btn').forEach(b => {

// ==================== CARD RENDERING ====================
function createCardFace(card, isReversed = false) {
  let suitClass = card.type === 'major' ? 'major-arcana' : `minor-${card.suit}`;
  let topLabel = card.type === 'major' ? card.num : card.rank;
  let suitEmoji = '';
  if (card.type === 'minor') {
    const suitMap = { wands: '🪄', cups: '🏆', swords: '⚔️', pentacles: '🪙' };
    suitEmoji = `<span class="suit-icon">${suitMap[card.suit] || ''}</span>`;
  }
  return `
    <div class="card-face ${suitClass} ${isReversed ? 'reversed' : ''}">
      <span class="card-num">${topLabel}</span>
      <span class="card-emoji">${card.emoji}</span>
      <span class="card-name">${card.name}</span>
      ${suitEmoji}
    </div>
  `;
}

function createCardBack(backType) {
  return `<div class="card-back ${backType}"></div>`;
}

function renderCardElement(card, showFace = true, isReversed = false, backType = null) {
  const bt = backType || currentCardBack;
  return `
    <div class="tarot-card">
      ${showFace ? createCardFace(card, isReversed) : createCardBack(bt)}
    </div>
  `;
}

function getCardMeaning(card) {
  return card.isReversed ? card.reversed : card.meaning;
}

function getOrientationBadge(isReversed) {
  return `<span class="orientation-badge ${isReversed ? 'reversed-badge' : 'upright'}">${isReversed ? '逆位' : '正位'}</span>`;
}

// ==================== OVERALL INTERPRETATION SUMMARY ====================
function generateSummary(topic, spreadLabel, cards) {
  const topicText = topic ? `关于「${topic}」的问题` : '关于你心中的疑问';
  let summary = `你咨询了${topicText}，使用「${spreadLabel}」牌阵进行占卜。\n\n`;

  const cardDetails = cards.map((c, i) => {
    const pos = c.position || '启示';
    const dir = c.isReversed ? '（逆位）' : '（正位）';
    return `「${pos}」位置出现了${c.emoji}【${c.name}】${dir}，这张牌在这里意味着：${c.meaning}`;
  });

  summary += cardDetails.join('\n\n');

  const uprightCount = cards.filter(c => !c.isReversed).length;
  const reversedCount = cards.filter(c => c.isReversed).length;

  summary += '\n\n---\n\n';

  let overall = '';
  if (cards.length === 1) {
    const c = cards[0];
    if (c.isReversed) {
      overall = `整体而言，这张牌以逆位出现，提示当前可能存在阻碍或需要反思之处。建议你放慢脚步，审视内心真正的需求，不要急于做出判断。`;
    } else {
      overall = `整体而言，这张牌以正位呈现，是一个积极的信号。它鼓励你保持信心，勇敢面对当前的境遇，宇宙正在为你铺路。`;
    }
  } else {
    if (reversedCount === 0) {
      overall = `整体来看，${cards.length}张牌全部以正位呈现，能量非常积极。这表明你的处境整体向好，各方面都在朝着有利的方向发展。建议你顺势而为，把握当下的良好时机。`;
    } else if (uprightCount === 0) {
      overall = `整体来看，${cards.length}张牌全部以逆位呈现，提示当前可能面临较多挑战。但这并非坏事——逆位牌往往揭示需要关注的内在课题。建议你静心反思，逐一化解眼前的阻碍。`;
    } else {
      const dominant = uprightCount >= reversedCount ? '正位牌居多，整体趋势向好' : '逆位牌居多，提示需要更多内省';
      overall = `整体来看，${cards.length}张牌中正位${uprightCount}张、逆位${reversedCount}张，${dominant}。牌面呈现出一种动态平衡的状态，既有助力也有挑战。建议你既珍视有利因素，也正视需要改进之处，在行动与反思之间找到平衡。`;
    }
  }

  summary += overall;
  return summary;
}

function selectTopic(topic, btn) {
  const input = document.getElementById('topicInput');
  const allTags = document.querySelectorAll('#topicTags .topic-tag');
  if (btn.classList.contains('selected')) {
    btn.classList.remove('selected');
    currentTopic = '';
    input.value = '';
  } else {
    allTags.forEach(t => t.classList.remove('selected'));
    btn.classList.add('selected');
    currentTopic = topic;
    input.value = topic;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const topicInput = document.getElementById('topicInput');
  if (topicInput) {
    topicInput.addEventListener('input', () => {
      currentTopic = topicInput.value;
      const allTags = document.querySelectorAll('#topicTags .topic-tag');
      allTags.forEach(t => {
        t.classList.toggle('selected', t.dataset.topic === topicInput.value);
      });
      if (!topicInput.value) {
        allTags.forEach(t => t.classList.remove('selected'));
      }
    });

// ==================== DRAW ====================
function triggerDraw() {
  const deckArea = document.getElementById('deckArea');
  const drawBtn = document.getElementById('drawBtn');

  drawBtn.disabled = true;
  resetResult();

  deckArea.classList.add('shuffling');
  setTimeout(() => {
    deckArea.classList.remove('shuffling');
    deckArea.classList.add('cut-animation');
    setTimeout(() => {
      deckArea.classList.remove('cut-animation');
      performDraw();
      drawBtn.disabled = false;
    }, 800);
  }, 600);
}

function performDraw() {
  const count = currentMode === 'three' ? 3 : 1;
  const shuffled = [...ALL_CARDS].sort(() => Math.random() - 0.5);
  drawnCards = shuffled.slice(0, count).map(card => ({
    ...card,
    isReversed: Math.random() > 0.5
  }));

  spawnParticles();

  const resultArea = document.getElementById('resultArea');
  let positions;
  if (currentMode === 'three') {
    positions = THREE_CARD_SPREADS[threeCardSpreadType].positions;
  } else {
    positions = [SINGLE_POSITION];
  }

  resultArea.innerHTML = `
    <div class="result-cards">
      ${drawnCards.map((card, i) => `
        <div class="result-card-wrapper" style="--reveal-delay: ${i * 0.3}s">
          <div class="position-label">${positions[i].name}</div>
          ${renderCardElement(card, true, card.isReversed)}
          <div style="margin-top:8px;font-size:0.8em;">
            ${getOrientationBadge(card.isReversed)}
          </div>
        </div>
      `).join('')}
    </div>
    <div style="text-align:center;margin-top:12px;">
      <button class="export-btn" onclick="exportShareCard()">📋 导出分享卡片</button>
    </div>
    <div class="card-interpretation" id="interpretation"></div>
  `;

  setTimeout(() => resultArea.classList.add('show'), 100);

  setTimeout(() => {
    const interp = document.getElementById('interpretation');
    const topic = currentTopic || document.getElementById('topicInput').value.trim();
    const spreadLabel = currentMode === 'three'
      ? THREE_CARD_SPREADS[threeCardSpreadType].name
      : '单张牌';
    const summaryCards = drawnCards.map((c, i) => ({
      ...c,
      position: positions[i].name,
      description: positions[i].desc,
      meaning: getCardMeaning(c)
    }));
    const summary = generateSummary(topic, spreadLabel, summaryCards);

    interp.style.display = 'block';
    interp.innerHTML = drawnCards.map((card, i) => `
      <div style="margin-bottom:18px;">
        <div class="card-title">${positions[i].name} · ${card.name}</div>
        <div class="position-desc">💡 ${positions[i].desc}</div>
        ${getOrientationBadge(card.isReversed)}
        <div class="meaning-text">${getCardMeaning(card)}</div>
      </div>
    `).join('') + `
      <div class="summary-box">
        <div class="summary-text">${summary.replace(/\n/g, '<br>')}</div>
      </div>
    `;
  }, 600);

  saveReading(positions);
}

function resetResult() {
  const resultArea = document.getElementById('resultArea');
  resultArea.classList.remove('show');
  resultArea.innerHTML = '';
  const interp = document.getElementById('interpretation');
  if (interp) interp.style.display = 'none';
}

function spawnParticles() {
  const container = document.createElement('div');
  container.className = 'particles';
  container.style.top = '50%';
  container.style.left = '50%';
  document.body.appendChild(container);

  const emojis = ['✨', '💫', '⭐', '🌟', '🔮', '💜'];
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('span');
    p.className = 'particle';
    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    p.style.setProperty('--dx', (Math.random() - 0.5) * 300 + 'px');
    p.style.setProperty('--dy', (Math.random() - 0.5) * 300 - 100 + 'px');
    p.style.animationDelay = Math.random() * 0.3 + 's';
    container.appendChild(p);
  }

  setTimeout(() => container.remove(), 1800);
}

// ==================== SAVE & HISTORY ====================
function saveReading(positions) {
  const topic = currentTopic || document.getElementById('topicInput').value.trim();
  const records = getHistory();
  const spreadLabel = currentMode === 'three'
    ? THREE_CARD_SPREADS[threeCardSpreadType].name
    : '单张牌';

  const summaryCards = drawnCards.map((c, i) => ({
    name: c.name,
    emoji: c.emoji,
    isReversed: c.isReversed,
    position: positions[i].name,
    description: positions[i].desc,
    meaning: getCardMeaning(c)
  }));

  const summary = generateSummary(topic, spreadLabel, summaryCards);

  records.unshift({
    id: Date.now(),
    time: new Date().toLocaleString('zh-CN'),
    mode: currentMode === 'three' ? '三张牌' : '单张牌',
    spreadLabel: spreadLabel,
    topic: topic || null,
    summary: summary,
    favorite: false,
    note: '',
    cardNotes: summaryCards.map(() => ''),
    cards: summaryCards
  });
  if (records.length > 100) records.length = 100;
  localStorage.setItem('tarotHistory', JSON.stringify(records));
  saveHistoryState(null);
}

function getHistory() {
  try {
    return JSON.parse(localStorage.getItem('tarotHistory') || '[]');
  } catch { return []; }
}

function renderHistory() {
  const container = document.getElementById('historyList');
  const countEl = document.getElementById('historyCount');
  let records = getHistory();

  if (historyFilter === 'favorites') {
    records = records.filter(r => r.favorite);
  } else if (historyFilter !== 'all') {
    records = records.filter(r => r.mode === historyFilter);
  }

  const searchTerm = (document.getElementById('historySearch')?.value || '').trim().toLowerCase();
  if (searchTerm) {
    records = records.filter(r => (r.topic || '').toLowerCase().includes(searchTerm));
  }

  if (advDateFrom) {
    records = records.filter(r => {
      const d = new Date(r.time);
      const from = new Date(advDateFrom);
      return d >= from;
    });
  }
  if (advDateTo) {
    records = records.filter(r => {
      const d = new Date(r.time);
      const to = new Date(advDateTo + 'T23:59:59');
      return d <= to;
    });
  }
  if (advCardName) {
    const kw = advCardName.toLowerCase();
    records = records.filter(r => r.cards.some(c => c.name.toLowerCase().includes(kw)));
  }
  if (advOrientation !== 'all') {
    records = records.filter(r => {
      if (advOrientation === 'all-upright') return r.cards.every(c => !(c.isReversed || c.reversed));
      if (advOrientation === 'all-reversed') return r.cards.every(c => !!(c.isReversed || c.reversed));
      if (advOrientation === 'mixed') {
        const hasUp = r.cards.some(c => !(c.isReversed || c.reversed));
        const hasRev = r.cards.some(c => !!(c.isReversed || c.reversed));
        return hasUp && hasRev;
      }
      return true;
    });
  }

  if (countEl) {
    countEl.textContent = records.length > 0 ? `共 ${records.length} 条` : '';
  }

  if (records.length === 0) {
    container.innerHTML = '<div class="history-empty">🔮 还没有匹配的占卜记录</div>';
    return;
  }
  container.innerHTML = records.map(r => `
    <div class="history-item" onclick="viewHistoryDetail('${r.id}')">
      <div class="history-time">
        <button class="fav-star ${r.favorite ? 'active' : ''}" onclick="event.stopPropagation();toggleFavorite('${r.id}')">${r.favorite ? '★' : '☆'}</button>
        ${r.time}
      </div>
      <div class="history-type">${r.spreadLabel || r.mode}占卜${r.mode === '自定义牌阵' ? ' · ' + (r.topic || '') : ''}</div>
      ${r.topic ? `<div class="history-topic">主题：<span>${r.topic}</span></div>` : ''}
      <div class="history-cards">${r.cards.map(c => `${c.emoji} ${c.name}(${(c.isReversed || c.reversed) ? '逆' : '正'})`).join(' · ')}</div>
      ${r.note ? `<div class="points">💬 ${r.note.substring(0, 40)}${r.note.length > 40 ? '...' : ''}</div>` : ''}

function updateCardNote(id, cardIndex, value) {

function buildReviewTimeline(currentId) {
  const records = getHistory();
  const current = records.find(r => r.id == currentId);
  if (!current || !current.topic) return;

  const sameTopic = records
    .filter(r => r.topic === current.topic)
    .sort((a, b) => a.id - b.id);

  const area = document.getElementById('reviewTimelineArea');
  if (!area) return;

  const trend = generateTrendSummary(sameTopic);

  area.innerHTML = `
    <h3 style="text-align:center;color:var(--gold-light);margin:24px 0 12px;">📊 复盘时间线 · ${current.topic}</h3>
    <div class="review-trend">
      <h4>📈 趋势总结</h4>
      <div style="color:var(--text);font-size:0.85em;line-height:1.7;">${trend}</div>
    </div>
    <div class="review-timeline">
      ${sameTopic.map(r => {
        const isCurrent = r.id == currentId;
        return `
          <div class="review-timeline-item" onclick="viewHistoryDetail('${r.id}')" style="${isCurrent ? 'border-color:var(--gold);background:rgba(212,168,67,0.08);' : ''}">
            <div class="tl-time">${isCurrent ? '📍 当前查看' : '📅'} ${r.time}</div>
            <div style="color:var(--text-dim);font-size:0.75em;">${r.spreadLabel || r.mode} · ${r.favorite ? '⭐ ' : ''}${r.note ? '💬 ' : ''}</div>
            <div class="tl-cards">${r.cards.map(c => `${c.emoji} ${c.name}(${(c.isReversed || c.reversed) ? '逆' : '正'})`).join(' · ')}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function generateTrendSummary(sameTopicRecords) {
  if (sameTopicRecords.length <= 1) return '只有一次占卜记录，暂无趋势可分析。';

  const allCards = [];
  const cardFreq = {};
  sameTopicRecords.forEach(r => {
    r.cards.forEach(c => {
      allCards.push(c);
      const key = c.name;
      cardFreq[key] = (cardFreq[key] || 0) + 1;
    });
  });

  const totalCards = allCards.length;
  const uprightCount = allCards.filter(c => !(c.isReversed || c.reversed)).length;
  const reversedCount = allCards.filter(c => !!(c.isReversed || c.reversed)).length;

  const topCards = Object.entries(cardFreq)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 3);

  const majorCards = allCards.filter(c => {
    const full = ALL_CARDS.find(fc => fc.name === c.name);
    return full && full.type === 'major';
  }).length;

  let summary = '';
  summary += `共 ${sameTopicRecords.length} 次占卜，抽到 ${totalCards} 张牌，其中正位 ${uprightCount} 张、逆位 ${reversedCount} 张。`;

  if (topCards.length > 0) {
    summary += `\n\n出现最频繁的牌：${topCards.map(([name, count]) => `【${name}】(${count}次)`).join('、')}。`;
  }

  if (majorCards > 0) {
    summary += `\n\n大阿尔卡纳出现了 ${majorCards} 次（占 ${Math.round(majorCards / totalCards * 100)}%），提示人生重要课题正在浮现。`;
  }

  if (reversedCount > uprightCount) {
    summary += '\n\n逆位牌占多数，这个主题可能还需要更多反思和内省，注意那些反复出现的阻碍信号。';
  } else if (uprightCount > reversedCount * 2) {
    summary += '\n\n正位牌显著居多，能量流动顺畅，这个主题整体呈现积极向上的趋势。';
  } else {
    summary += '\n\n正逆位比例接近平衡，这个主题既有顺利的一面也有需要留意的挑战，保持觉察很重要。';
  }

  return summary;
}

function exportHistoryCard(id) {

function showShareModal(topic, spreadLabel, date, cards, positions, summary, record) {

    let txt = `🔮 塔罗占卜\n━━━━━━━━━━━━━━\n`;
    if (topic) txt += `主题：${topic}\n`;
    txt += `牌阵：${spreadLabel}\n日期：${date}\n━━━━━━━━━━━━━━\n`;
    txt += cards.map((c, i) => {
      const pos = positions ? positions[i].name : (c.position || '启示');
      const desc = positions ? positions[i].desc : (c.description || '');
      const dir = c.isReversed ? '（逆位）' : '（正位）';
      let entry = `${pos}：${c.emoji} ${c.name} ${dir}`;
      if (desc) entry += `\n💡 ${desc}`;
      entry += `\n${c.isReversed ? c.reversed : c.meaning}`;
      if (includeNotes && record && record.cardNotes && record.cardNotes[i]) {
        entry += `\n💬 ${record.cardNotes[i]}`;
      }
      return entry;
    }).join('\n\n');
    if (summary) txt += `\n\n---\n📖 整体解读\n${summary}`;
    if (includeNotes && record && record.note) {
      txt += `\n\n💬 感想：${record.note}`;
    }
    txt += `\n━━━━━━━━━━━━━━\n✦ 神秘塔罗 · 命运之轮转动 ✦`;
    return txt;
  };

  let currentIncludeNotes = false;
  const fullText = buildText(false);
  const fullTextWithNotes = hasNotes ? buildText(true) : fullText;

  const modal = document.getElementById('dailyModal');
  const content = document.getElementById('dailyModalContent');
  content.innerHTML = `
    <h2>📋 分享卡片</h2>
    <div class="share-card-content" id="shareCardPreview">
      <div class="share-header">🔮 塔罗占卜</div>
      ${topic ? `<div class="share-topic">主题：${topic}</div>` : ''}
      <div class="share-topic" style="font-size:0.8em;">牌阵：${spreadLabel} · ${date}</div>
      <div class="share-cards">
        ${cards.map((c, i) => {
          const pos = positions ? positions[i].name : (c.position || '启示');
          const desc = positions ? positions[i].desc : (c.description || '');
          return `<div class="share-card-item">
            <div>${c.emoji} <strong>${c.name}</strong> · ${pos} <span style="color:${c.isReversed ? '#e74c3c' : '#2ecc71'};">${c.isReversed ? '逆位' : '正位'}</span></div>
            ${desc ? `<div style="font-size:0.75em;color:#6a4a8a;margin-top:2px;">💡 ${desc}</div>` : ''}
            <div style="font-size:0.8em;color:#555;margin-top:3px;">${c.isReversed ? c.reversed : c.meaning}</div>
          </div>`;
        }).join('')}
      </div>
      ${summary ? `<div style="margin-top:10px;padding:8px 10px;background:rgba(212,168,67,0.1);border-radius:8px;font-size:0.78em;line-height:1.6;color:#3e1a6e;border-left:2px solid var(--gold);">📖 ${summary.replace(/\n/g, '<br>')}</div>` : ''}
      <div class="share-footer">✦ 神秘塔罗 · 命运之轮转动 ✦</div>
    </div>
    ${hasNotes ? `<div class="share-note-toggle"><label><input type="checkbox" id="shareIncludeNotes" onchange="updateShareText(this.checked)" /> 导出时包含私人备注</label></div>` : ''}
    <div class="share-actions">
      <button class="btn-copy" id="shareCopyBtn" onclick="copyShareTextById()">📋 复制文本</button>
      <button class="close-btn" onclick="closeModal()" style="margin-top:0;">关闭</button>

  `;

  window._shareTextNoNotes = fullText;

  window._currentShareText = fullText;
}

function updateShareText(includeNotes) {
  window._currentShareText = includeNotes ? window._shareTextWithNotes : window._shareTextNoNotes;
}

function copyShareTextById() {
  const text = window._currentShareText || window._shareTextNoNotes || '';
  copyShareText(text);
}

function copyShareText(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      showToast('✅ 已复制到剪贴板');
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showToast('✅ 已复制到剪贴板'); }
  catch { showToast('❌ 复制失败，请手动复制'); }
  document.body.removeChild(ta);
}

// ==================== SPREAD DESIGN MODE ====================
function switchSpreadMode(mode) {
  spreadMode = mode;
  document.querySelectorAll('.spread-mode-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.spread-mode-tab[data-spread-mode="${mode}"]`).classList.add('active');

  if (mode === 'design') {
    document.getElementById('spreadDesignMode').style.display = 'block';
    document.getElementById('spreadReadingMode').style.display = 'none';
    buildSpreadGrid();
  } else {
    document.getElementById('spreadDesignMode').style.display = 'none';
    document.getElementById('spreadReadingMode').style.display = 'block';
    spreadReadingTemplate = null;
    spreadReadingCells = [];
    document.getElementById('spreadReadingGrid').innerHTML = '';
    document.getElementById('spreadReadingActions').style.display = 'none';
    document.getElementById('spreadResultArea').innerHTML = '';
    document.getElementById('spreadResultArea').classList.remove('show');
    renderReadingTemplates();
  }
}

function buildSpreadGrid() {
  if (spreadMode !== 'design') return;
  const rows = parseInt(document.getElementById('gridRows').value) || 2;
  const cols = parseInt(document.getElementById('gridCols').value) || 3;
  const grid = document.getElementById('spreadGrid');
  grid.style.gridTemplateColumns = `repeat(${cols}, 120px)`;
  grid.style.gridTemplateRows = `repeat(${rows}, 180px)`;

  spreadCells = [];
  grid.innerHTML = '';

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const idx = r * cols + c;
      spreadCells.push({ row: r, col: c, name: '', description: '' });
      const cell = document.createElement('div');
      cell.className = 'grid-cell';
      cell.dataset.index = idx;
      cell.draggable = true;

      cell.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      });

      cell.addEventListener('drop', e => {
        e.preventDefault();
        const fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
        if (!isNaN(fromIdx) && fromIdx !== idx) {
          swapSpreadCells(fromIdx, idx);
        }
      });

      cell.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/plain', idx.toString());
        e.dataTransfer.effectAllowed = 'move';
      });

      cell.innerHTML = `
        <div class="cell-empty-text">拖拽调整位置</div>
        <input class="cell-name-input" placeholder="位置名称" value="${spreadCells[idx].name}"
          onchange="updateCellName(${idx}, this.value)" onclick="event.stopPropagation()" />
        <textarea class="cell-desc-input" placeholder="牌位说明（可选）"
          onchange="updateCellDesc(${idx}, this.value)" onclick="event.stopPropagation()">${spreadCells[idx].description || ''}</textarea>
      `;

      grid.appendChild(cell);
    }
  }

  renderDesignCells();
}

function renderDesignCells() {
  const cells = document.querySelectorAll('#spreadGrid .grid-cell');
  cells.forEach((cell, idx) => {
    const data = spreadCells[idx];
    if (!data) return;
    const nameInput = cell.querySelector('.cell-name-input');
    if (nameInput) nameInput.value = data.name;
    const descInput = cell.querySelector('.cell-desc-input');
    if (descInput) descInput.value = data.description || '';
  });
}

function updateCellName(idx, value) {
  if (spreadCells[idx]) {
    spreadCells[idx].name = value;
  }
}

function updateCellDesc(idx, value) {
  if (spreadCells[idx]) {
    spreadCells[idx].description = value;
  }
}

function swapSpreadCells(fromIdx, toIdx) {
  const temp = spreadCells[fromIdx];
  spreadCells[fromIdx] = spreadCells[toIdx];
  spreadCells[toIdx] = temp;
  renderDesignCells();
}

function saveSpreadTemplate() {
  const namedCells = spreadCells.filter(c => c.name.trim());
  if (namedCells.length === 0) {
    showToast('请至少为一个位置命名');
    return;
  }

  const name = prompt('请为这个牌阵模板命名：', currentSpread?.name || '我的自定义牌阵');
  if (!name) return;

  const templates = getSpreadTemplates();
  const templateData = {
    name,
    rows: parseInt(document.getElementById('gridRows').value) || 2,
    cols: parseInt(document.getElementById('gridCols').value) || 3,
    cells: spreadCells.map(c => ({
      name: c.name,
      description: c.description || ''
    })),
    savedAt: new Date().toLocaleString('zh-CN')
  };

  if (currentSpread && currentSpread.name === name) {
    const idx = templates.findIndex(s => s.name === name);
    if (idx >= 0) templates[idx] = templateData;
  } else {
    templates.unshift(templateData);
  }

  localStorage.setItem('tarotSpreadTemplates', JSON.stringify(templates));
  currentSpread = templateData;
  showToast('牌阵模板已保存：' + name);
  renderSavedTemplates();
}

function getSpreadTemplates() {
  try { return JSON.parse(localStorage.getItem('tarotSpreadTemplates') || '[]'); }
  catch { return []; }
}

function loadSpreadTemplate(index) {
  const templates = getSpreadTemplates();
  if (index < 0 || index >= templates.length) return;
  const template = templates[index];
  currentSpread = template;

  document.getElementById('gridRows').value = template.rows;
  document.getElementById('gridCols').value = template.cols;
  buildSpreadGrid();

  template.cells.forEach((c, i) => {
    if (i < spreadCells.length) {
      spreadCells[i].name = c.name || '';
      spreadCells[i].description = c.description || '';
    }
  });
  renderDesignCells();
  showToast('已加载模板：' + template.name);
}

function deleteCurrentTemplate() {
  if (!currentSpread) { showToast('没有已加载的模板'); return; }
  if (confirm(`确定删除模板「${currentSpread.name}」吗？`)) {
    const templates = getSpreadTemplates().filter(s => s.name !== currentSpread.name);
    localStorage.setItem('tarotSpreadTemplates', JSON.stringify(templates));
    currentSpread = null;
    buildSpreadGrid();
    showToast('模板已删除');
    renderSavedTemplates();
  }
}

function toggleSavedTemplates() {
  const el = document.getElementById('savedTemplatesList');
  if (el.style.display === 'none') {
    renderSavedTemplates();
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

function renderSavedTemplates() {
  const el = document.getElementById('savedTemplatesList');
  const templates = getSpreadTemplates();
  if (templates.length === 0) {
    el.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:10px;">暂无保存的模板</div>';
    return;
  }
  el.innerHTML = '<h4>已保存的模板</h4>' + templates.map((s, i) => `
    <div class="saved-spread-item" onclick="loadSpreadTemplate(${i})">
      <div>
        <div>✨ ${s.name} <span style="color:var(--text-dim);font-size:0.75em;">${s.rows}×${s.cols}</span></div>
        <div style="color:var(--text-dim);font-size:0.7em;margin-top:2px;">${s.cells.filter(c => c.name).map(c => c.name).join(' · ') || '未命名'}</div>
      </div>
      <span style="color:var(--text-dim);font-size:0.75em;">${s.savedAt}</span>
    </div>
  `).join('');
}

// ==================== SPREAD READING MODE ====================
function renderReadingTemplates() {
  if (spreadMode !== 'reading') return;
  const el = document.getElementById('readingTemplatesList');
  const templates = getSpreadTemplates();
  if (templates.length === 0) {
    el.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:20px;">还没有牌阵模板，请先在「设计牌阵」中创建</div>';
    document.getElementById('spreadReadingGrid').innerHTML = '';
    document.getElementById('spreadReadingActions').style.display = 'none';
    return;
  }
  el.innerHTML = '<h4>选择牌阵模板开始占卜</h4>' + templates.map((s, i) => `
    <div class="saved-spread-item" onclick="selectTemplateForReading(${i})" style="${spreadReadingTemplate && spreadReadingTemplate.name === s.name ? 'border-color:var(--gold);background:rgba(212,168,67,0.1);' : ''}">
      <div>
        <div>✨ ${s.name} <span style="color:var(--text-dim);font-size:0.75em;">${s.rows}×${s.cols}</span></div>
        <div style="color:var(--text-dim);font-size:0.7em;margin-top:2px;">${s.cells.filter(c => c.name).map(c => c.name).join(' · ') || '未命名'}</div>
      </div>
      <span style="color:var(--text-dim);font-size:0.7em;">${s.cells.filter(c => c.name).length}个牌位</span>
    </div>
  `).join('');
}

function selectTemplateForReading(index) {
  const templates = getSpreadTemplates();
  if (index < 0 || index >= templates.length) return;
  spreadReadingTemplate = templates[index];
  spreadReadingTopic = document.getElementById('spreadTopicInput').value.trim();

  const grid = document.getElementById('spreadReadingGrid');
  const template = spreadReadingTemplate;
  const validCells = template.cells.filter(c => c.name.trim());
  const cols = template.cols;

  grid.style.gridTemplateColumns = `repeat(${cols}, 120px)`;
  grid.style.gridTemplateRows = '';
  grid.innerHTML = '';

  spreadReadingCells = validCells.map((c, idx) => ({
    name: c.name,
    description: c.description || '',
    card: null,
    index: idx
  }));

  validCells.forEach((c, idx) => {
    const cell = document.createElement('div');
    cell.className = 'grid-cell';
    cell.innerHTML = `
      <div class="cell-empty-text">${c.name}</div>
      ${c.description ? `<div style="font-size:0.65em;color:var(--text-dim);margin-top:2px;text-align:center;">${c.description}</div>` : ''}
    `;
    grid.appendChild(cell);
  });

  document.getElementById('spreadReadingActions').style.display = 'flex';
  document.getElementById('spreadResultArea').innerHTML = '';
  document.getElementById('spreadResultArea').classList.remove('show');
  renderReadingTemplates();
}

function drawSpreadReading() {
  if (!spreadReadingTemplate) {
    showToast('请先选择一个牌阵模板');
    return;
  }

  const topic = document.getElementById('spreadTopicInput').value.trim();
  spreadReadingTopic = topic;

  const shuffled = [...ALL_CARDS].sort(() => Math.random() - 0.5);
  let cardIdx = 0;

  spreadReadingCells.forEach(cell => {
    cell.card = {
      ...shuffled[cardIdx % shuffled.length],
      isReversed: Math.random() > 0.5
    };
    cardIdx++;
  });

  const grid = document.getElementById('spreadReadingGrid');
  const cells = grid.querySelectorAll('.grid-cell');
  cells.forEach((cell, idx) => {
    const data = spreadReadingCells[idx];
    if (!data || !data.card) return;
    cell.className = 'grid-cell filled';
    cell.innerHTML = `
      <div class="cell-card-mini">${data.card.emoji}</div>
      <div class="cell-name-input" style="pointer-events:none;">${data.name}</div>
      ${data.description ? `<div style="font-size:0.6em;color:var(--text-dim);">${data.description}</div>` : ''}
      <button class="cell-remove" onclick="event.stopPropagation();viewSpreadReadingCard(${idx})">👁</button>
    `;
    cell.onclick = () => viewSpreadReadingCard(idx);
  });

  spawnParticles();

  const resultArea = document.getElementById('spreadResultArea');
  const summaryCards = spreadReadingCells.filter(c => c.card).map(c => ({
    name: c.card.name,
    emoji: c.card.emoji,
    isReversed: c.card.isReversed,
    position: c.name,
    description: c.description,
    meaning: getCardMeaning(c.card)
  }));
  const summary = generateSummary(topic, spreadReadingTemplate.name, summaryCards);

  resultArea.innerHTML = `
    <div class="card-interpretation" style="margin-top:16px;">
      ${spreadReadingCells.map((cell, i) => {
        if (!cell.card) return '';
        const card = cell.card;
        return `
          <div style="margin-bottom:18px;">
            <div class="card-title">${cell.name} · ${card.name}</div>
            ${cell.description ? `<div class="position-desc">💡 ${cell.description}</div>` : ''}
            ${getOrientationBadge(card.isReversed)}
            <div class="meaning-text">${getCardMeaning(card)}</div>
          </div>
        `;
      }).join('')}
    </div>
    <div class="summary-box">
      <div class="summary-text">${summary.replace(/\n/g, '<br>')}</div>
    </div>
  `;
  resultArea.classList.add('show');

  saveSpreadReadingToHistory(summary);
  showToast('占卜完成！已保存到历史记录');
}

function viewSpreadReadingCard(idx) {
  const cell = spreadReadingCells[idx];
  if (!cell || !cell.card) return;

  const card = cell.card;
  const posName = cell.name || '位置 ' + (idx + 1);
  const posDesc = cell.description || '';

  const modal = document.getElementById('dailyModal');
  const content = document.getElementById('dailyModalContent');
  content.innerHTML = `
    <h2>${posName}</h2>
    ${posDesc ? `<div style="color:var(--text-dim);font-size:0.85em;font-style:italic;margin-bottom:12px;">💡 ${posDesc}</div>` : ''}
    <div class="daily-card" style="margin-bottom: 0;">
      ${renderCardElement(card, true, card.isReversed)}
      <div style="margin-top:8px;">
        ${getOrientationBadge(card.isReversed)}
      </div>
      <div style="color:var(--gold-light);font-weight:700;font-size:1.1em;">${card.name}</div>
      <div style="color:var(--text);font-size:0.9em;line-height:1.6;margin-top:8px;">
        ${getCardMeaning(card)}
      </div>
    </div>
    <button class="close-btn" onclick="closeModal()">关闭</button>
  `;
  modal.style.display = 'flex';
}

function saveSpreadReadingToHistory(summary) {
  const records = getHistory();
  const templateName = spreadReadingTemplate ? spreadReadingTemplate.name : '自定义牌阵';

  records.unshift({
    id: Date.now(),
    time: new Date().toLocaleString('zh-CN'),
    mode: '自定义牌阵',
    spreadLabel: templateName,
    topic: spreadReadingTopic || null,
    summary: summary,
    favorite: false,
    note: '',
    cardNotes: spreadReadingCells.filter(c => c.card).map(() => ''),
    cards: spreadReadingCells.filter(c => c.card).map(c => ({
      name: c.card.name,
      emoji: c.card.emoji,
      isReversed: c.card.isReversed,
      position: c.name,
      description: c.description || '',
      meaning: getCardMeaning(c.card)
    }))
  });
  if (records.length > 100) records.length = 100;
  localStorage.setItem('tarotHistory', JSON.stringify(records));
  saveHistoryState(null);
}

// ==================== CARD BACK ====================
function selectCardBack(type) {
  currentCardBack = type;
  localStorage.setItem('cardBack', type);
  updateDeckBacks();
  applyCardBackSelection();
  showToast('牌背已切换');
}

function applyCardBackSelection() {
  document.querySelectorAll('.card-back-option').forEach(opt => {
    opt.classList.toggle('selected', opt.dataset.back === currentCardBack);
  });
}

// ==================== DAILY DRAW ====================
function checkDailyDraw() {
  const today = new Date().toDateString();
  const lastDraw = localStorage.getItem('dailyDrawDate');

  if (lastDraw === today) return;

  const dailyCard = ALL_CARDS[Math.floor(Math.random() * ALL_CARDS.length)];
  const isReversed = Math.random() > 0.5;
  const saved = {
    date: today,
    card: { name: dailyCard.name, emoji: dailyCard.emoji, isReversed, meaning: isReversed ? dailyCard.reversed : dailyCard.meaning }
  };
  localStorage.setItem('dailyDrawDate', today);
  localStorage.setItem('dailyDrawCard', JSON.stringify(saved.card));

  const modal = document.getElementById('dailyModal');
  const content = document.getElementById('dailyModalContent');
  content.innerHTML = `
    <h2>🌟 今日塔罗指引</h2>
    <p style="color:var(--text-dim);margin-bottom:8px;">${today}</p>
    <div class="daily-card">
      ${renderCardElement(dailyCard, true, isReversed)}
      <div style="margin-top:8px;">
        ${getOrientationBadge(isReversed)}
      </div>
      <div style="color:var(--gold-light);font-weight:700;font-size:1.1em;">${dailyCard.name}</div>
      <div style="color:var(--text);font-size:0.9em;line-height:1.6;">
        ${isReversed ? dailyCard.reversed : dailyCard.meaning}
      </div>
    </div>
    <button class="close-btn" onclick="closeModal()">我知道了</button>
  `;
  modal.style.display = 'flex';

  sendNotification(dailyCard, isReversed);
}

function sendNotification(card, isReversed) {
  if (!('Notification' in window)) return;

  if (Notification.permission === 'granted') {
    new Notification('🔮 今日塔罗指引', {
      body: `${card.name}（${isReversed ? '逆位' : '正位'}）—— ${isReversed ? card.reversed.substring(0, 40) + '...' : card.meaning.substring(0, 40) + '...'}`,
      icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🔮</text></svg>'
    });
  } else if (Notification.permission === 'default') {
    Notification.requestPermission().then(perm => {
      if (perm === 'granted') sendNotification(card, isReversed);
    });
  }
}

function closeModal() {
  document.getElementById('dailyModal').style.display = 'none';
}

// ==================== TOAST ====================
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 2200);
}

// ==================== START ====================
init();
</script>
</body>
</html>
