<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔮 塔罗牌占卜</title>
<style>
:root {
  --bg: #1a0a2e;
  --bg-panel: #1f1140;
  --bg-card: #2a1555;
  --gold: #d4a843;
  --gold-light: #f0d68a;
  --text: #e8d5f5;
  --text-dim: #9988b8;
  --accent: #7b5ea7;
  --purple-glow: rgba(140, 100, 220, 0.4);
  --card-width: 140px;
  --card-height: 230px;
  --radius: 16px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  background-image:
    radial-gradient(ellipse at 20% 20%, rgba(100, 50, 180, 0.15) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 80%, rgba(40, 20, 100, 0.2) 0%, transparent 60%);
}

.stars {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
}
.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  animation: twinkle var(--dur) ease-in-out infinite;
  animation-delay: var(--delay);
  opacity: 0;
}
@keyframes twinkle {
  0%,100% { opacity: 0.2; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.5); }
}

.app-container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 20px; }

/* ===== HEADER ===== */
.header {
  text-align: center; padding: 30px 20px 20px;
  position: relative;
}
.header h1 {
  font-size: 2.4em;
  background: linear-gradient(135deg, var(--gold-light), var(--gold), #b8860b);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 700;
  letter-spacing: 2px;
  text-shadow: none;
}
.header .subtitle {
  color: var(--text-dim);
  font-size: 0.95em;
  margin-top: 4px;
  letter-spacing: 4px;
}

/* ===== NAV ===== */
.nav {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin: 10px 0 30px;
  flex-wrap: wrap;
  background: var(--bg-panel);
  border-radius: 40px;
  padding: 5px;
  border: 1px solid rgba(212, 168, 67, 0.2);
}
.nav-btn {
  padding: 10px 22px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  border-radius: 30px;
  cursor: pointer;
  font-size: 0.95em;
  transition: var(--transition);
  font-family: inherit;
  letter-spacing: 1px;
  white-space: nowrap;
}
.nav-btn:hover { color: var(--gold-light); }
.nav-btn.active {
  background: linear-gradient(135deg, var(--accent), #5a3d8a);
  color: #fff;
  box-shadow: 0 4px 15px var(--purple-glow);
}

/* ===== PANELS ===== */
.panel {
  display: none;
  animation: fadeSlideIn 0.4s ease;
}
.panel.active { display: block; }
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

.section-title {
  text-align: center;
  font-size: 1.4em;
  color: var(--gold-light);
  margin-bottom: 24px;
  letter-spacing: 2px;
}

/* ===== DIVINATION PANEL ===== */
.mode-select {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-bottom: 30px;
  flex-wrap: wrap;
}
.mode-card {
  background: var(--bg-panel);
  border: 2px solid rgba(212, 168, 67, 0.15);
  border-radius: var(--radius);
  padding: 24px 32px;
  cursor: pointer;
  transition: var(--transition);
  text-align: center;
  min-width: 160px;
}
.mode-card:hover {
  border-color: var(--gold);
  transform: translateY(-3px);
  box-shadow: 0 8px 30px var(--purple-glow);
}
.mode-card.selected {
  border-color: var(--gold);
  background: rgba(212, 168, 67, 0.1);
  box-shadow: 0 0 25px var(--purple-glow);
}
.mode-card .mode-icon { font-size: 2.5em; margin-bottom: 8px; }
.mode-card .mode-name { font-size: 1.1em; font-weight: 600; color: var(--gold-light); }
.mode-card .mode-desc { font-size: 0.8em; color: var(--text-dim); margin-top: 4px; }

.deck-area {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 0;
  perspective: 1000px;
  min-height: 280px;
}

.deck-stack {
  position: relative;
  width: var(--card-width);
  height: var(--card-height);
  cursor: pointer;
}

.stack-card {
  position: absolute;
  width: 100%; height: 100%;
  border-radius: 12px;
  transition: transform 0.5s ease, opacity 0.5s ease;
}

.stack-card:nth-child(1) { transform: translate(-6px, 4px); }
.stack-card:nth-child(2) { transform: translate(0px, 2px); }
.stack-card:nth-child(3) { transform: translate(6px, 0px); }

.deck-stack:hover .stack-card:nth-child(1) { transform: translate(-12px, 6px); }
.deck-stack:hover .stack-card:nth-child(2) { transform: translate(0px, 0px); }
.deck-stack:hover .stack-card:nth-child(3) { transform: translate(12px, -6px); }

/* Card design */
.tarot-card {
  width: var(--card-width);
  height: var(--card-height);
  border-radius: 12px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 25px rgba(0,0,0,0.5);
  transition: var(--transition);
  user-select: none;
}

.card-back {
  width: 100%; height: 100%;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Card back patterns */
.card-back.classic {
  background: linear-gradient(135deg, #1a0a3e, #2d1b69);
  border: 3px solid var(--gold);
}
.card-back.classic::after {
  content: '✦';
  font-size: 3em;
  color: var(--gold);
  text-shadow: 0 0 20px var(--gold);
  animation: rotateStar 8s linear infinite;
}
@keyframes rotateStar {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.card-back.mystic {
  background:
    repeating-conic-gradient(#1a0a3e 0% 5%, #2d1b69 5% 10%) 50% / 30px 30px;
  border: 3px solid #9b59b6;
}
.card-back.mystic::after {
  content: '🌙';
  font-size: 2.8em;
  filter: drop-shadow(0 0 12px #9b59b6);
}

.card-back.celestial {
  background: radial-gradient(circle at 30% 30%, #0d1b3e, #050d22);
  border: 3px solid #4fc3f7;
}
.card-back.celestial::after {
  content: '☀';
  font-size: 3em;
  color: #ffd54f;
  text-shadow: 0 0 25px #ffd54f;
}

.card-back.rose {
  background: linear-gradient(135deg, #3e1a3e, #2d0a2d);
  border: 3px solid #e91e63;
}
.card-back.rose::after {
  content: '🌹';
  font-size: 2.8em;
  filter: drop-shadow(0 0 12px #e91e63);
}

.card-back.royal {
  background: linear-gradient(135deg, #1a0a3e, #3e1a0a);
  border: 3px solid #ff6f00;
}
.card-back.royal::after {
  content: '👑';
  font-size: 2.8em;
  filter: drop-shadow(0 0 12px #ff6f00);
}

/* Card face */
.card-face {
  width: 100%; height: 100%;
  border-radius: 10px;
  background: linear-gradient(180deg, #faf3e0 0%, #e8d5b7 60%, #d4c4a0 100%);
  color: #2a1555;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px 8px;
  text-align: center;
  border: 3px solid var(--gold);
  font-weight: 700;
  position: relative;
}

.card-face.reversed {
  transform: rotate(180deg);
}

.card-face .card-num {
  font-size: 0.7em;
  color: #6a4a8a;
  letter-spacing: 1px;
}

.card-face .card-emoji {
  font-size: 2.5em;
  margin: 6px 0;
}

.card-face .card-name {
  font-size: 0.9em;
  line-height: 1.3;
  color: #3e1a6e;
}

.card-face .card-suit {
  font-size: 1.4em;
}

.minor-wands { border-color: #e65100; }
.minor-cups { border-color: #1565c0; }
.minor-swords { border-color: #ffd600; }
.minor-pentacles { border-color: #2e7d32; }
.major-arcana { border-color: var(--gold); }

.suit-icon {
  font-size: 1.6em;
  margin-bottom: 2px;
}

/* Shuffle animation */
.shuffling .deck-stack {
  animation: deckShake 0.6s ease-in-out;
}
@keyframes deckShake {
  0%,100% { transform: translateX(0); }
  10% { transform: translateX(-15px) rotate(-3deg); }
  30% { transform: translateX(15px) rotate(3deg); }
  50% { transform: translateX(-10px) rotate(-2deg); }
  70% { transform: translateX(10px) rotate(1deg); }
  90% { transform: translateX(-4px) rotate(-0.5deg); }
}

.cut-animation .stack-card {
  animation: cardCut 0.8s ease forwards;
}
.cut-animation .stack-card:nth-child(1) {
  animation-name: cutLeft;
}
.cut-animation .stack-card:nth-child(2) {
  animation-name: cutCenter;
}
.cut-animation .stack-card:nth-child(3) {
  animation-name: cutRight;
}
@keyframes cutLeft {
  0% { transform: translate(-6px, 4px); }
  40% { transform: translate(-60px, -20px) rotate(-15deg); }
  100% { transform: translate(-6px, 4px); }
}
@keyframes cutCenter {
  0% { transform: translate(0px, 2px); }
  40% { transform: translate(0px, -30px); }
  100% { transform: translate(0px, 2px); }
}
@keyframes cutRight {
  0% { transform: translate(6px, 0px); }
  40% { transform: translate(60px, -20px) rotate(15deg); }
  100% { transform: translate(6px, 0px); }
}

/* Draw button */
.draw-btn {
  display: block;
  margin: 0 auto 20px;
  padding: 14px 50px;
  font-size: 1.15em;
  font-weight: 700;
  letter-spacing: 3px;
  border: none;
  border-radius: 40px;
  cursor: pointer;
  background: linear-gradient(135deg, var(--gold), #b8860b);
  color: #1a0a2e;
  transition: var(--transition);
  box-shadow: 0 6px 25px rgba(212,168,67,0.3);
  font-family: inherit;
}
.draw-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 35px rgba(212,168,67,0.5);
}
.draw-btn:active {
  transform: translateY(1px);
}
.draw-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

/* Result area */
.result-area {
  margin-top: 10px;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.5s ease;
}
.result-area.show {
  opacity: 1;
  transform: translateY(0);
}

.result-cards {
  display: flex;
  justify-content: center;
  gap: 24px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}

.result-card-wrapper {
  text-align: center;
  animation: cardReveal 0.8s ease forwards;
  animation-delay: var(--reveal-delay);
  opacity: 0;
}
@keyframes cardReveal {
  0% { opacity: 0; transform: translateY(40px) rotateY(90deg); }
  100% { opacity: 1; transform: translateY(0) rotateY(0deg); }
}

.result-card-wrapper .tarot-card {
  cursor: default;
  margin: 0 auto;
}

.position-label {
  color: var(--gold-light);
  font-size: 0.85em;
  margin-bottom: 8px;
  letter-spacing: 1px;
}

.card-interpretation {
  background: var(--bg-panel);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-top: 12px;
  border: 1px solid rgba(212,168,67,0.15);
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
}

.card-interpretation .card-title {
  font-size: 1.1em;
  color: var(--gold-light);
  font-weight: 700;
  margin-bottom: 4px;
}

.card-interpretation .orientation-badge {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 20px;
  font-size: 0.8em;
  font-weight: 600;
  margin-bottom: 10px;
}
.orientation-badge.upright {
  background: rgba(46,204,113,0.2);
  color: #2ecc71;
}
.orientation-badge.reversed {
  background: rgba(231,76,60,0.2);
  color: #e74c3c;
}

.card-interpretation .meaning-text {
  color: var(--text);
  font-size: 0.95em;
  line-height: 1.7;
  margin-top: 8px;
}

/* ===== HISTORY PANEL ===== */
.history-list {
  max-width: 600px;
  margin: 0 auto;
}

.history-item {
  background: var(--bg-panel);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 12px;
  border: 1px solid rgba(212,168,67,0.1);
  cursor: pointer;
  transition: var(--transition);
}
.history-item:hover {
  border-color: var(--gold);
  transform: translateX(4px);
}
.history-item .history-time {
  font-size: 0.8em;
  color: var(--text-dim);
}
.history-item .history-type {
  color: var(--gold-light);
  font-weight: 600;
  margin: 4px 0;
}
.history-item .history-cards {
  font-size: 0.9em;
  color: var(--text);
}

.history-empty {
  text-align: center;
  color: var(--text-dim);
  padding: 40px;
}

.clear-btn {
  display: block;
  margin: 20px auto;
  padding: 8px 24px;
  background: transparent;
  border: 1px solid rgba(231,76,60,0.5);
  border-radius: 20px;
  color: #e74c3c;
  cursor: pointer;
  font-size: 0.85em;
  transition: var(--transition);
  font-family: inherit;
}
.clear-btn:hover {
  background: rgba(231,76,60,0.1);
}

/* ===== SPREAD BUILDER PANEL ===== */
.spread-controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.spread-controls button, .spread-controls select {
  padding: 10px 20px;
  border-radius: 25px;
  border: 1px solid var(--accent);
  background: var(--bg-panel);
  color: var(--text);
  cursor: pointer;
  font-family: inherit;
  font-size: 0.9em;
  transition: var(--transition);
}
.spread-controls button:hover {
  background: var(--accent);
  color: #fff;
}

.spread-grid-size {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-dim);
  font-size: 0.85em;
}
.spread-grid-size input {
  width: 50px;
  padding: 6px;
  border-radius: 8px;
  border: 1px solid var(--accent);
  background: var(--bg-panel);
  color: var(--text);
  text-align: center;
  font-family: inherit;
  font-size: 0.9em;
}

.spread-grid {
  display: grid;
  gap: 10px;
  justify-content: center;
  padding: 20px;
  min-height: 200px;
}

.grid-cell {
  width: 120px;
  height: 180px;
  border: 2px dashed rgba(212,168,67,0.3);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
  position: relative;
  background: rgba(42,21,85,0.4);
  cursor: pointer;
}

.grid-cell:hover {
  border-color: var(--gold);
  background: rgba(212,168,67,0.08);
}

.grid-cell.filled {
  border-style: solid;
  border-color: var(--gold);
  background: rgba(212,168,67,0.1);
}

.grid-cell .cell-name-input {
  width: 90%;
  padding: 4px 8px;
  border: 1px solid var(--accent);
  border-radius: 8px;
  background: rgba(0,0,0,0.3);
  color: var(--text);
  text-align: center;
  font-size: 0.8em;
  font-family: inherit;
  margin-top: 4px;
}

.grid-cell .cell-name-input::placeholder {
  color: var(--text-dim);
}

.grid-cell .cell-empty-text {
  color: var(--text-dim);
  font-size: 0.8em;
}

.grid-cell .cell-card-mini {
  width: 60px;
  height: 98px;
  border-radius: 8px;
  background: linear-gradient(180deg, #faf3e0, #e8d5b7);
  color: #2a1555;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4em;
  border: 2px solid var(--gold);
}

.grid-cell .cell-remove {
  position: absolute;
  top: 4px;
  right: 6px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: rgba(231,76,60,0.8);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 0.7em;
  display: none;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.grid-cell.filled .cell-remove {
  display: flex;
}

.spread-actions {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.spread-actions button {
  padding: 10px 24px;
  border-radius: 25px;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.9em;
  transition: var(--transition);
  letter-spacing: 1px;
}
.spread-actions .btn-save {
  background: var(--gold);
  color: #1a0a2e;
  font-weight: 700;
}
.spread-actions .btn-save:hover {
  background: var(--gold-light);
}
.spread-actions .btn-load {
  background: var(--accent);
  color: #fff;
}
.spread-actions .btn-load:hover {
  background: #8b6ab0;
}
.spread-actions .btn-delete {
  background: transparent;
  border: 1px solid #e74c3c;
  color: #e74c3c;
}

.saved-spreads-list {
  max-width: 400px;
  margin: 16px auto;
}
.saved-spreads-list h4 {
  color: var(--gold-light);
  margin-bottom: 8px;
  font-size: 0.9em;
}
.saved-spreads-list .saved-spread-item {
  background: var(--bg-panel);
  border-radius: 10px;
  padding: 10px 16px;
  margin-bottom: 6px;
  cursor: pointer;
  border: 1px solid rgba(212,168,67,0.1);
  transition: var(--transition);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.saved-spreads-list .saved-spread-item:hover {
  border-color: var(--gold);
}

/* ===== SETTINGS PANEL ===== */
.settings-group {
  background: var(--bg-panel);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 16px;
  border: 1px solid rgba(212,168,67,0.1);
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
}
.settings-group h3 {
  color: var(--gold-light);
  margin-bottom: 14px;
  font-size: 1em;
}

.card-back-options {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: center;
}
.card-back-option {
  cursor: pointer;
  text-align: center;
  transition: var(--transition);
  padding: 6px;
  border-radius: 12px;
  border: 2px solid transparent;
}
.card-back-option:hover {
  border-color: var(--gold);
}
.card-back-option.selected {
  border-color: var(--gold);
  background: rgba(212,168,67,0.1);
}
.card-back-option .preview-card {
  width: 70px;
  height: 115px;
  border-radius: 8px;
  overflow: hidden;
}
.card-back-option .preview-name {
  font-size: 0.75em;
  color: var(--text-dim);
  margin-top: 4px;
}

/* ===== DAILY DRAW MODAL ===== */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.8);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  animation: fadeIn 0.3s ease;
  backdrop-filter: blur(4px);
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal {
  background: var(--bg-panel);
  border-radius: var(--radius);
  padding: 30px;
  max-width: 420px;
  width: 90%;
  text-align: center;
  border: 1px solid var(--gold);
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  animation: modalPopIn 0.4s ease;
}
@keyframes modalPopIn {
  0% { transform: scale(0.8); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.modal h2 {
  color: var(--gold-light);
  margin-bottom: 16px;
  font-size: 1.4em;
}

.modal .daily-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin: 16px 0;
}

.modal .daily-card .tarot-card {
  animation: cardReveal 0.8s ease;
}

.modal .close-btn {
  margin-top: 16px;
  padding: 10px 30px;
  border-radius: 25px;
  border: none;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.95em;
  transition: var(--transition);
}
.modal .close-btn:hover {
  background: #8b6ab0;
}

/* ===== FOOTER ===== */
.footer {
  text-align: center;
  padding: 30px;
  color: var(--text-dim);
  font-size: 0.8em;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 640px) {
  .header h1 { font-size: 1.8em; }
  .mode-card { padding: 16px 20px; min-width: 130px; }
  .mode-card .mode-icon { font-size: 2em; }
  .result-cards { gap: 16px; }
  .tarot-card { --card-width: 120px; --card-height: 196px; }
  .nav-btn { padding: 8px 14px; font-size: 0.8em; }
  .grid-cell { width: 90px; height: 140px; }
}

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--bg-panel);
  color: var(--gold-light);
  padding: 12px 28px;
  border-radius: 30px;
  font-size: 0.9em;
  border: 1px solid var(--gold);
  z-index: 2000;
  opacity: 0;
  transition: all 0.3s ease;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ===== LOADING PARTICLES ===== */
.particles {
  position: fixed;
  pointer-events: none;
  z-index: 999;
}
.particle {
  position: absolute;
  font-size: 1.5em;
  animation: particleFloat 1.5s ease-out forwards;
  pointer-events: none;
}
@keyframes particleFloat {
  0% { opacity: 1; transform: translate(0, 0) scale(1); }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
}
</style>
</head>

function getAllCards() {
  const cards = [];
  TAROT_DB.majorArcana.forEach(c => cards.push({ ...c, type: 'major' }));
  for (const [suit, suitCards] of Object.entries(TAROT_DB.minorArcana)) {
    suitCards.forEach(c => cards.push({ ...c, type: 'minor', suit }));
  }
  return cards;
}

// ==================== STATE ====================
const ALL_CARDS = getAllCards();
let currentMode = 'single';
let drawnCards = [];
let currentCardBack = localStorage.getItem('cardBack') || 'classic';
let currentSpread = null;
let spreadCells = [];

// ==================== INIT ====================
function init() {
  createStars();
  updateDeckBacks();
  applyCardBackSelection();
  buildSpreadGrid();
  checkDailyDraw();

  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      const panelId = 'panel-' + btn.dataset.panel;
      document.getElementById(panelId).classList.add('active');
      if (btn.dataset.panel === 'history') renderHistory();
      if (btn.dataset.panel === 'spread') buildSpreadGrid();
    });
  });
}

function createStars() {
  const container = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    const size = Math.random() * 3 + 1;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.setProperty('--dur', (Math.random() * 3 + 2) + 's');
    star.style.setProperty('--delay', Math.random() * 5 + 's');
    container.appendChild(star);
  }
}

// ==================== CARD RENDERING ====================
function createCardFace(card, reversed = false) {
  let suitClass = card.type === 'major' ? 'major-arcana' : `minor-${card.suit}`;
  let topLabel = card.type === 'major' ? card.num : card.rank;
  let suitEmoji = '';
  if (card.type === 'minor') {
    const suitMap = { wands: '🪄', cups: '🏆', swords: '⚔️', pentacles: '🪙' };
    suitEmoji = `<span class="suit-icon">${suitMap[card.suit] || ''}</span>`;
  }
  return `
    <div class="card-face ${suitClass} ${reversed ? 'reversed' : ''}">
      <span class="card-num">${topLabel}</span>
      <span class="card-emoji">${card.emoji}</span>
      <span class="card-name">${card.name}</span>
      ${suitEmoji}
    </div>
  `;
}

function createCardBack(backType) {
  return `<div class="card-back ${backType}"></div>`;
}

function renderCardElement(card, showFace = true, reversed = false, backType = null) {
  const bt = backType || currentCardBack;
  return `
    <div class="tarot-card">
      ${showFace ? createCardFace(card, reversed) : createCardBack(bt)}
    </div>
  `;
}

// ==================== DECK BACKS ====================
function updateDeckBacks() {
  for (let i = 1; i <= 3; i++) {
    const el = document.getElementById('deckBack' + i);
    if (el) {
      el.className = 'card-back ' + currentCardBack;
    }
  }
}

// ==================== MODE SELECTION ====================
function selectMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
  document.querySelector(`.mode-card[data-mode="${mode}"]`).classList.add('selected');
  resetResult();
}

// ==================== DRAW ====================
function triggerDraw() {
  const deckArea = document.getElementById('deckArea');
  const drawBtn = document.getElementById('drawBtn');

  drawBtn.disabled = true;
  resetResult();

  deckArea.classList.add('shuffling');
  setTimeout(() => {
    deckArea.classList.remove('shuffling');
    deckArea.classList.add('cut-animation');
    setTimeout(() => {
      deckArea.classList.remove('cut-animation');
      performDraw();
      drawBtn.disabled = false;
    }, 800);
  }, 600);
}

function performDraw() {
  const count = currentMode === 'three' ? 3 : 1;
  const shuffled = [...ALL_CARDS].sort(() => Math.random() - 0.5);
  drawnCards = shuffled.slice(0, count).map(card => ({
    ...card,
    reversed: Math.random() > 0.5
  }));

  spawnParticles();

  const resultArea = document.getElementById('resultArea');
  const positions = currentMode === 'three' ? ['过去', '现在', '未来'] : ['启示'];

  resultArea.innerHTML = `
    <div class="result-cards">
      ${drawnCards.map((card, i) => `
        <div class="result-card-wrapper" style="--reveal-delay: ${i * 0.3}s">
          <div class="position-label">${positions[i]}</div>
          ${renderCardElement(card, true, card.reversed)}
          <div style="margin-top:8px;font-size:0.8em;">
            <span class="orientation-badge ${card.reversed ? 'reversed' : 'upright'}">${card.reversed ? '逆位' : '正位'}</span>
          </div>
        </div>
      `).join('')}
    </div>
    <div class="card-interpretation" id="interpretation"></div>
  `;

  setTimeout(() => resultArea.classList.add('show'), 100);

  setTimeout(() => {
    const interp = document.getElementById('interpretation');
    interp.style.display = 'block';
    interp.innerHTML = drawnCards.map((card, i) => `
      <div style="margin-bottom:18px;">
        <div class="card-title">${positions[i]} · ${card.name}</div>
        <span class="orientation-badge ${card.reversed ? 'reversed' : 'upright'}">${card.reversed ? '逆位' : '正位'}</span>
        <div class="meaning-text">${card.reversed ? card.reversed : card.meaning}</div>
      </div>
    `).join('');
  }, 600);

  saveReading();
}

function resetResult() {
  const resultArea = document.getElementById('resultArea');
  resultArea.classList.remove('show');
  resultArea.innerHTML = '';
  const interp = document.getElementById('interpretation');
  if (interp) interp.style.display = 'none';
}

function spawnParticles() {
  const container = document.createElement('div');
  container.className = 'particles';
  container.style.top = '50%';
  container.style.left = '50%';
  document.body.appendChild(container);

  const emojis = ['✨', '💫', '⭐', '🌟', '🔮', '💜'];
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('span');
    p.className = 'particle';
    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    p.style.setProperty('--dx', (Math.random() - 0.5) * 300 + 'px');
    p.style.setProperty('--dy', (Math.random() - 0.5) * 300 - 100 + 'px');
    p.style.animationDelay = Math.random() * 0.3 + 's';
    container.appendChild(p);
  }

  setTimeout(() => container.remove(), 1800);
}

function saveReading() {
  const records = getHistory();
  records.unshift({
    id: Date.now(),
    time: new Date().toLocaleString('zh-CN'),
    mode: currentMode === 'three' ? '三张牌' : '单张牌',
    cards: drawnCards.map(c => ({
      name: c.name,
      emoji: c.emoji,
      reversed: c.reversed,
      meaning: c.reversed ? c.reversed : c.meaning
    }))
  });
  if (records.length > 100) records.length = 100;
  localStorage.setItem('tarotHistory', JSON.stringify(records));
}

// ==================== SPREAD BUILDER ====================
function buildSpreadGrid() {
  const rows = parseInt(document.getElementById('gridRows').value) || 2;
  const cols = parseInt(document.getElementById('gridCols').value) || 3;
  const grid = document.getElementById('spreadGrid');
  grid.style.gridTemplateColumns = `repeat(${cols}, 120px)`;
  grid.style.gridTemplateRows = `repeat(${rows}, 180px)`;

  spreadCells = [];
  grid.innerHTML = '';

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const idx = r * cols + c;
      spreadCells.push({ row: r, col: c, name: '', card: null });
      const cell = document.createElement('div');
      cell.className = 'grid-cell';
      cell.dataset.index = idx;
      cell.draggable = true;

      cell.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      });

      cell.addEventListener('drop', e => {
        e.preventDefault();
        const fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
        if (!isNaN(fromIdx) && fromIdx !== idx) {
          swapSpreadCells(fromIdx, idx);
        }
      });

      cell.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/plain', idx.toString());
        e.dataTransfer.effectAllowed = 'move';
      });

      cell.addEventListener('click', () => {
        if (spreadCells[idx].card) {
          showSpreadCardDetail(idx);
        }
      });

      cell.innerHTML = `
        <div class="cell-empty-text">点击放置</div>
        <input class="cell-name-input" placeholder="位置名称" value="${spreadCells[idx].name}"
          onchange="updateCellName(${idx}, this.value)" onclick="event.stopPropagation()" />
        <button class="cell-remove" onclick="event.stopPropagation();removeCellCard(${idx})">✕</button>
      `;

      grid.appendChild(cell);
    }
  }

  renderSpreadCells();
}

function renderSpreadCells() {
  const cells = document.querySelectorAll('#spreadGrid .grid-cell');
  cells.forEach((cell, idx) => {
    const data = spreadCells[idx];
    if (!data) return;
    cell.className = 'grid-cell' + (data.card ? ' filled' : '');
    const nameInput = cell.querySelector('.cell-name-input');
    if (nameInput) nameInput.value = data.name;

    if (data.card) {
      cell.querySelector('.cell-empty-text').style.display = 'none';
      let miniEl = cell.querySelector('.cell-card-mini');
      if (!miniEl) {
        miniEl = document.createElement('div');
        miniEl.className = 'cell-card-mini';
        cell.insertBefore(miniEl, cell.querySelector('.cell-name-input'));
      }
      miniEl.textContent = data.card.emoji;
      miniEl.title = data.card.name + (data.card.reversed ? '(逆位)' : '(正位)');
    } else {
      cell.querySelector('.cell-empty-text').style.display = '';
      const miniEl = cell.querySelector('.cell-card-mini');
      if (miniEl) miniEl.remove();
    }
  });
}

function updateCellName(idx, value) {
  if (spreadCells[idx]) {
    spreadCells[idx].name = value;
  }
}

function swapSpreadCells(fromIdx, toIdx) {
  const temp = spreadCells[fromIdx];
  spreadCells[fromIdx] = spreadCells[toIdx];
  spreadCells[toIdx] = temp;
  renderSpreadCells();
}

function removeCellCard(idx) {
  if (spreadCells[idx]) {
    spreadCells[idx].card = null;
    renderSpreadCells();
  }
}

function drawCardsForSpread() {
  const shuffled = [...ALL_CARDS].sort(() => Math.random() - 0.5);
  let cardIdx = 0;
  spreadCells.forEach(cell => {
    if (cell.name || !cell.card) {
      cell.card = {
        ...shuffled[cardIdx % shuffled.length],
        reversed: Math.random() > 0.5
      };
      cardIdx++;
    }
  });
  renderSpreadCells();
  showToast('已随机填牌');
}

function showSpreadCardDetail(idx) {
  const cell = spreadCells[idx];
  if (!cell || !cell.card) return;

  const card = cell.card;
  const posName = cell.name || '位置 ' + (idx + 1);

  const modal = document.getElementById('dailyModal');
  const content = document.getElementById('dailyModalContent');
  content.innerHTML = `
    <h2>${posName}</h2>
    <div class="daily-card" style="margin-bottom: 0;">
      ${renderCardElement(card, true, card.reversed)}
      <div style="margin-top:8px;">
        <span class="orientation-badge ${card.reversed ? 'reversed' : 'upright'}">${card.reversed ? '逆位' : '正位'}</span>
      </div>
      <div style="color:var(--text);font-size:0.9em;line-height:1.6;margin-top:8px;">
        ${card.reversed ? card.reversed : card.meaning}
      </div>
    </div>

  `;
  modal.style.display = 'flex';
}

  const spreads = getSavedSpreads();
  const spreadData = {

    rows: parseInt(document.getElementById('gridRows').value) || 2,
    cols: parseInt(document.getElementById('gridCols').value) || 3,
    cells: spreadCells.map(c => ({
      name: c.name,
      card: c.card ? { name: c.card.name, emoji: c.card.emoji, reversed: c.card.reversed, meaning: c.card.reversed ? c.card.reversed : c.card.meaning } : null
    })),
    savedAt: new Date().toLocaleString('zh-CN')
  };

  if (currentSpread && currentSpread.name === name) {
    const idx = spreads.findIndex(s => s.name === name);
    if (idx >= 0) spreads[idx] = spreadData;
  } else {
    spreads.unshift(spreadData);
  }

  localStorage.setItem('tarotSpreads', JSON.stringify(spreads));
  currentSpread = spreadData;
  showToast('牌阵已保存：' + name);
  renderSavedSpreads();
}

function getSavedSpreads() {
  try { return JSON.parse(localStorage.getItem('tarotSpreads') || '[]'); }
  catch { return []; }
}

function loadSpread(index) {
  const spreads = getSavedSpreads();
  if (index < 0 || index >= spreads.length) return;
  const spread = spreads[index];
  currentSpread = spread;

  document.getElementById('gridRows').value = spread.rows;
  document.getElementById('gridCols').value = spread.cols;
  buildSpreadGrid();

  spread.cells.forEach((c, i) => {
    if (i < spreadCells.length) {
      spreadCells[i].name = c.name || '';
      if (c.card) {
        const full = ALL_CARDS.find(fc => fc.name === c.card.name);
        if (full) {
          spreadCells[i].card = { ...full, reversed: c.card.reversed };
        }
      }
    }
  });
  renderSpreadCells();
  showToast('已加载牌阵：' + spread.name);
}

function deleteCurrentSpread() {
  if (!currentSpread) { showToast('没有已加载的牌阵'); return; }
  if (confirm(`确定删除牌阵「${currentSpread.name}」吗？`)) {
    const spreads = getSavedSpreads().filter(s => s.name !== currentSpread.name);
    localStorage.setItem('tarotSpreads', JSON.stringify(spreads));
    currentSpread = null;
    buildSpreadGrid();
    showToast('牌阵已删除');
    renderSavedSpreads();
  }
}

function toggleSavedSpreads() {
  const el = document.getElementById('savedSpreadsList');
  if (el.style.display === 'none') {
    renderSavedSpreads();
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

function renderSavedSpreads() {
  const el = document.getElementById('savedSpreadsList');
  const spreads = getSavedSpreads();
  if (spreads.length === 0) {
    el.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:10px;">暂无保存的牌阵</div>';
    return;
  }
  el.innerHTML = '<h4>已保存的牌阵</h4>' + spreads.map((s, i) => `
    <div class="saved-spread-item" onclick="loadSpread(${i})">
      <span>✨ ${s.name} <span style="color:var(--text-dim);font-size:0.75em;">${s.rows}×${s.cols}</span></span>
      <span style="color:var(--text-dim);font-size:0.75em;">${s.savedAt}</span>
    </div>
  `).join('');
}

// ==================== CARD BACK ====================
function selectCardBack(type) {
  currentCardBack = type;
  localStorage.setItem('cardBack', type);
  updateDeckBacks();
  applyCardBackSelection();
  showToast('牌背已切换');
}

function applyCardBackSelection() {
  document.querySelectorAll('.card-back-option').forEach(opt => {
    opt.classList.toggle('selected', opt.dataset.back === currentCardBack);
  });
}

// ==================== DAILY DRAW ====================
function checkDailyDraw() {
  const today = new Date().toDateString();
  const lastDraw = localStorage.getItem('dailyDrawDate');

  if (lastDraw === today) return;

  const dailyCard = ALL_CARDS[Math.floor(Math.random() * ALL_CARDS.length)];
  const reversed = Math.random() > 0.5;
  const saved = {
    date: today,
    card: { name: dailyCard.name, emoji: dailyCard.emoji, reversed, meaning: reversed ? dailyCard.reversed : dailyCard.meaning }
  };
  localStorage.setItem('dailyDrawDate', today);
  localStorage.setItem('dailyDrawCard', JSON.stringify(saved.card));

  const modal = document.getElementById('dailyModal');
  const content = document.getElementById('dailyModalContent');
  content.innerHTML = `
    <h2>🌟 今日塔罗指引</h2>
    <p style="color:var(--text-dim);margin-bottom:8px;">${today}</p>
    <div class="daily-card">
      ${renderCardElement(dailyCard, true, reversed)}
      <div style="margin-top:8px;">
        <span class="orientation-badge ${reversed ? 'reversed' : 'upright'}">${reversed ? '逆位' : '正位'}</span>
      </div>
      <div style="color:var(--gold-light);font-weight:700;font-size:1.1em;">${dailyCard.name}</div>
      <div style="color:var(--text);font-size:0.9em;line-height:1.6;">
        ${reversed ? dailyCard.reversed : dailyCard.meaning}
      </div>
    </div>
    <button class="close-btn" onclick="closeModal()">我知道了</button>
  `;
  modal.style.display = 'flex';

  sendNotification(dailyCard, reversed);
}

function sendNotification(card, reversed) {
  if (!('Notification' in window)) return;

  if (Notification.permission === 'granted') {
    new Notification('🔮 今日塔罗指引', {
      body: `${card.name}（${reversed ? '逆位' : '正位'}）—— ${reversed ? card.reversed.substring(0, 40) + '...' : card.meaning.substring(0, 40) + '...'}`,
      icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🔮</text></svg>'
    });
  } else if (Notification.permission === 'default') {
    Notification.requestPermission().then(perm => {
      if (perm === 'granted') sendNotification(card, reversed);
    });
  }
}

function closeModal() {
  document.getElementById('dailyModal').style.display = 'none';
}

// ==================== TOAST ====================
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 2200);
}

// ==================== START ====================
init();
</script>
</body>
</html>
